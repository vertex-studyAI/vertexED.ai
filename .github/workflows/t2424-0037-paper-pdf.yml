name: T2424-0037 NeuroCAD paper PDF

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portfolio/project2424/projects/T2424-0037/**"
      - "scripts/render-neurocad-paper-pdf.mjs"
      - "tests/t2424-0037-paper-pdf.test.mjs"
      - ".github/workflows/t2424-0037-paper-pdf.yml"

permissions:
  contents: read

jobs:
  render-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Assert frozen scientific boundary
        run: |
          grep -q "VALIDATION_DOMINANT" portfolio/project2424/projects/T2424-0037/MANUSCRIPT.md
          grep -Eqi "typed-parser-specific.*falsif|falsif.*typed-parser-specific" portfolio/project2424/projects/T2424-0037/MANUSCRIPT.md
          grep -Eqi "reused 20-case|reused diagnostic" portfolio/project2424/projects/T2424-0037/MANUSCRIPT.md
      - name: Render exact-head PDF
        run: |
          node scripts/render-neurocad-paper-pdf.mjs \
            portfolio/project2424/projects/T2424-0037/MANUSCRIPT.md \
            dist/t2424-0037-paper/T2424-0037-NeuroCAD-bounded-result.pdf
      - name: Verify deterministic PDF bytes
        run: |
          node scripts/render-neurocad-paper-pdf.mjs \
            portfolio/project2424/projects/T2424-0037/MANUSCRIPT.md \
            dist/t2424-0037-paper/rebuilt.pdf
          cmp dist/t2424-0037-paper/T2424-0037-NeuroCAD-bounded-result.pdf dist/t2424-0037-paper/rebuilt.pdf
          rm dist/t2424-0037-paper/rebuilt.pdf
      - name: Retain build provenance
        run: |
          sha256sum dist/t2424-0037-paper/T2424-0037-NeuroCAD-bounded-result.pdf | tee dist/t2424-0037-paper/SHA256SUMS
          node -e 'const fs=require("fs"); fs.writeFileSync("dist/t2424-0037-paper/build.json", JSON.stringify({head:process.env.GITHUB_SHA, run:process.env.GITHUB_RUN_ID, protocol_change:false, scientific_verdict:"VALIDATION_DOMINANT_TYPED_PARSER_CAUSALITY_FALSIFIED_ON_REUSED_DIAGNOSTIC", preprint_ready:false}, null, 2)+"\n")'
      - name: Upload rendered manuscript
        uses: actions/upload-artifact@v4
        with:
          name: t2424-0037-neurocad-rendered-paper
          path: dist/t2424-0037-paper
          if-no-files-found: error
          retention-days: 30
