name: Apply Study Notebook source-preview accessibility patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-study-notebook-source-preview-a11y.yml
      - scripts/apply-study-notebook-source-preview-a11y.mjs
      - src/pages/StudyNotebook.tsx
      - tests/study-notebook-source-preview-accessibility.test.mjs

permissions:
  contents: write

concurrency:
  group: study-notebook-source-preview-a11y
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: percy/study-notebook-source-preview-a11y
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded patch
        run: node scripts/apply-study-notebook-source-preview-a11y.mjs

      - name: Run focused regression
        run: node --test tests/study-notebook-source-preview-accessibility.test.mjs

      - name: Run canonical release checks
        run: npm run ci

      - name: Commit verified source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StudyNotebook.tsx tests/study-notebook-source-preview-accessibility.test.mjs
          git diff --cached --exit-code && { echo "No source change produced"; exit 1; } || true
          git commit -m "Make Study Notebook source preview keyboard-safe"
          git push origin HEAD:percy/study-notebook-source-preview-a11y
