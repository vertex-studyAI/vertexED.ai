name: Study Notebook source-preview accessibility

on:
  pull_request:
    branches: [main, master]
    paths:
      - src/pages/StudyNotebook.tsx
      - src/components/AccessibleModal.tsx
      - src/lib/modalFocus.mjs
      - tests/study-notebook-source-preview-accessibility.test.mjs
      - .github/workflows/apply-study-notebook-source-preview-a11y.yml
  push:
    branches: [main, master]
    paths:
      - src/pages/StudyNotebook.tsx
      - src/components/AccessibleModal.tsx
      - src/lib/modalFocus.mjs
      - tests/study-notebook-source-preview-accessibility.test.mjs
      - .github/workflows/apply-study-notebook-source-preview-a11y.yml

permissions:
  contents: read

concurrency:
  group: study-notebook-source-preview-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source-preview accessibility regression
        run: node --test tests/study-notebook-source-preview-accessibility.test.mjs
