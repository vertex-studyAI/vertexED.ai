name: Refresh security lockfile

on:
  push:
    branches:
      - percy/fix-2026-08-audit-advisories

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v5
        with:
          ref: percy/fix-2026-08-audit-advisories

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched production dependency tree
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit generated lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-security-lockfile.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m "security: regenerate lockfile for patched advisories"
          git push origin HEAD:percy/fix-2026-08-audit-advisories
