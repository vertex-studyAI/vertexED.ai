name: Bu1LD Release Integrity Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bu1ld-release-integrity-validation.yml'
      - 'portfolio/bu1ld/release-integrity/**'
      - 'portfolio/bu1ld/build-identity/**'

permissions:
  contents: read

concurrency:
  group: bu1ld-release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_COMMIT: daa80c1124b2a6d7d09b7669e04d29e50cffcbbe
      TEST_BUILD_COMMIT: 0123456789abcdef0123456789abcdef01234567

    steps:
      - name: Checkout portfolio control repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout immutable Bu1LD source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ryangomez010/bu1ld-landing
          ref: ${{ env.TARGET_COMMIT }}
          path: target

      - name: Apply deterministic target recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          node portfolio/bu1ld/release-integrity/apply-release-integrity.mjs target
          node portfolio/bu1ld/release-integrity/verify-release-integrity.mjs target "$TARGET_COMMIT"
          git -C target diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        working-directory: target
        run: bun install --frozen-lockfile

      - name: Normalize generated target file formatting
        working-directory: target
        run: bunx prettier --write scripts/verify-deployed-build.mjs

      - name: Run complete non-secret source gate
        working-directory: target
        env:
          BU1LD_BUILD_COMMIT: ${{ env.TEST_BUILD_COMMIT }}
          VITE_SUPABASE_URL: https://bu1ld-ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key-release-integrity
        shell: bash
        run: |
          set -o pipefail
          bun run release:check 2>&1 | tee "$GITHUB_WORKSPACE/bu1ld-release-integrity.log"

      - name: Verify immutable generated identity
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.TEST_BUILD_COMMIT;
          const identity = JSON.parse(fs.readFileSync('dist/client/build.json', 'utf8'));
          if (identity.service !== 'bu1ld' || identity.commit !== expected) {
            throw new Error(`unexpected build identity: ${JSON.stringify(identity)}`);
          }
          console.log(JSON.stringify(identity, null, 2));
          NODE

      - name: Verify patched deployment contract
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'run: bun run release:prod' .github/workflows/deploy-cloudflare.yml
          grep -F 'run: node scripts/verify-deployed-build.mjs' .github/workflows/deploy-cloudflare.yml
          grep -F 'SUPABASE_SERVICE_ROLE_KEY:' .github/workflows/deploy-cloudflare.yml
          grep -F 'RESEND_API_KEY:' .github/workflows/deploy-cloudflare.yml
          grep -F 'DIGEST_API_SECRET:' .github/workflows/deploy-cloudflare.yml
          grep -F 'VITE_EMAIL_ENDPOINT:' .github/workflows/deploy-cloudflare.yml

      - name: Verify onboarding no longer advertises an impossible skip
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'Skip for now — go to your dashboard' src/routes/onboarding.tsx
          grep -F 'Complete these four steps to unlock the member workspace.' src/routes/onboarding.tsx

      - name: Generate reviewable target patch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git add -N src/build.d.ts src/lib/build-identity.ts src/lib/build-identity.test.ts scripts/verify-deployed-build.mjs
          git diff --binary > "$GITHUB_WORKSPACE/bu1ld-release-integrity.patch"
          test -s "$GITHUB_WORKSPACE/bu1ld-release-integrity.patch"
          git apply --check "$GITHUB_WORKSPACE/bu1ld-release-integrity.patch" --reverse
          sha256sum "$GITHUB_WORKSPACE/bu1ld-release-integrity.patch" > "$GITHUB_WORKSPACE/bu1ld-release-integrity-patch.sha256"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bu1ld-release-integrity-${{ github.run_id }}
          path: |
            bu1ld-release-integrity.log
            bu1ld-release-integrity.patch
            bu1ld-release-integrity-patch.sha256
          if-no-files-found: ignore
          retention-days: 14
