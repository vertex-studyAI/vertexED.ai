name: Production Health Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-health.yml'
      - 'scripts/smoke-deploy.mjs'
      - 'api/_handlers/health.js'
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://www.vertexed.app
  INCIDENT_TITLE: Production health monitor failure

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout monitoring contract
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Probe homepage, liveness, and readiness
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p health-evidence
          base_url="${PRODUCTION_BASE_URL%/}"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          failure=0

          probe_url() {
            local name="$1"
            local url="$2"
            local body="health-evidence/${name}.body"
            local headers="health-evidence/${name}.headers"
            local metrics="health-evidence/${name}.metrics"

            echo "[monitor] Probing ${url}"
            if ! curl \
              --silent \
              --show-error \
              --location \
              --fail-with-body \
              --connect-timeout 10 \
              --max-time 25 \
              --retry 2 \
              --retry-delay 2 \
              --retry-all-errors \
              --dump-header "$headers" \
              --output "$body" \
              --write-out $'%{http_code}\t%{time_total}\t%{url_effective}\n' \
              "$url" > "$metrics"; then
              echo "[monitor] ${name} request failed"
              failure=1
              return
            fi

            local status
            status="$(cut -f1 "$metrics")"
            if [ "$status" != "200" ]; then
              echo "[monitor] ${name} returned HTTP ${status}, expected 200"
              failure=1
            fi

            if [ ! -s "$body" ]; then
              echo "[monitor] ${name} returned an empty response body"
              failure=1
            fi
          }

          probe_url homepage "${base_url}/"
          probe_url health "${base_url}/api/health"
          probe_url readiness "${base_url}/api/health?readiness=1"

          if [ -s health-evidence/homepage.body ] && ! grep -qi 'VertexED' health-evidence/homepage.body; then
            echo "[monitor] Homepage response did not contain the VertexED product marker"
            failure=1
          fi

          if [ -s health-evidence/health.body ] && [ -s health-evidence/readiness.body ]; then
            if ! python3 - health-evidence/health.body health-evidence/readiness.body <<'PY'
          import json
          import sys

          health_path, readiness_path = sys.argv[1:]
          with open(health_path, encoding="utf-8") as handle:
              health = json.load(handle)
          with open(readiness_path, encoding="utf-8") as handle:
              readiness = json.load(handle)

          if health.get("ok") is not True or health.get("status") != "alive":
              raise SystemExit(f"liveness payload must report ok=true and status=alive: {health!r}")

          required = ("authentication", "waitlist", "coreAi", "plannerAi")
          checks = readiness.get("checks") or {}
          if readiness.get("ok") is not True or readiness.get("status") != "ready":
              raise SystemExit(f"readiness payload must report ok=true and status=ready: {readiness!r}")
          if not all(checks.get(name) is True for name in required):
              raise SystemExit(f"readiness capability evidence is incomplete: {checks!r}")
          PY
            then
              echo "[monitor] Health or readiness JSON contract failed"
              failure=1
            fi
          else
            echo "[monitor] Health or readiness response body is missing"
            failure=1
          fi

          if [ -s health-evidence/health.headers ] \
            && ! grep -Eqi '^x-vertexed-health:[[:space:]]*alive' health-evidence/health.headers; then
            echo "[monitor] Liveness response is missing X-VertexED-Health: alive"
            failure=1
          fi

          if [ -s health-evidence/readiness.headers ] \
            && ! grep -Eqi '^x-vertexed-health:[[:space:]]*ready' health-evidence/readiness.headers; then
            echo "[monitor] Readiness response is missing X-VertexED-Health: ready"
            failure=1
          fi

          {
            echo "# VertexED production health"
            echo
            echo "- Checked at: ${started_at}"
            echo "- Base URL: ${base_url}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            for metrics in health-evidence/*.metrics; do
              [ -f "$metrics" ] || continue
              printf '%s: ' "$(basename "$metrics" .metrics)"
              cat "$metrics"
            done
            echo '```'
          } | tee health-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$failure" -ne 0 ]; then
            exit 1
          fi

      - name: Run full public security contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SMOKE_BASE_URL="${PRODUCTION_BASE_URL}" \
            node scripts/smoke-deploy.mjs 2>&1 \
            | tee health-evidence/security-contract.log

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: health-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Open or update production incident
        if: steps.probe.outcome == 'failure' || steps.contract.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The production monitor failed.

          - Checked URL: ${PRODUCTION_BASE_URL}
          - Homepage/readiness probe: ${PROBE_OUTCOME}
          - Public security contract: ${CONTRACT_OUTCOME}
          - Failed run: ${run_url}
          - Evidence artifact: production-health-${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}

          Review the retained headers, bodies, timing metrics, and security-contract log before changing production. Follow docs/PRODUCTION_INCIDENT_RUNBOOK.md. Do not paste secrets, session tokens, invite codes, or user content into this issue.
          EOF

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INCIDENT_TITLE" \
              --body-file "$body_file"
          fi

      - name: Close recovered production incident
        if: steps.probe.outcome == 'success' && steps.contract.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Production readiness and public security-contract checks recovered successfully. Evidence: ${run_url}"
          fi

      - name: Fail workflow when production is unhealthy
        if: steps.probe.outcome == 'failure' || steps.contract.outcome == 'failure'
        run: exit 1
