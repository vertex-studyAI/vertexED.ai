name: Production Health Monitor

on:
  pull_request:
    paths:
      - '.github/workflows/production-health.yml'
      - 'api/_handlers/health.js'
      - 'scripts/smoke-deploy.mjs'
      - 'scripts/vercel-ignore-build.mjs'
      - 'scripts/immutable-revision.mjs'
      - 'scripts/validate-immutable-revision.mjs'
      - 'tests/immutableRevision.test.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-health.yml'
      - 'api/_handlers/health.js'
      - 'scripts/smoke-deploy.mjs'
      - 'scripts/vercel-ignore-build.mjs'
      - 'scripts/immutable-revision.mjs'
      - 'scripts/validate-immutable-revision.mjs'
      - 'tests/immutableRevision.test.mjs'
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

env:
  SMOKE_BASE_URL: https://www.vertexed.app
  SMOKE_TIMEOUT_MS: '20000'
  INCIDENT_TITLE: Production health monitor failure

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Verify immutable revision contract
        run: node --test tests/immutableRevision.test.mjs

      - name: Run canonical public production smoke checks
        if: github.event_name != 'pull_request'
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p health-evidence
          log_path='health-evidence/production-smoke.log'
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          passed=0
          expected_revision='not-enforced-for-this-ref'

          if [ "${GITHUB_REF}" = 'refs/heads/main' ]; then
            deploy_revision="$(node scripts/vercel-ignore-build.mjs --print-latest-runtime-revision)"
            expected_revision="$(node scripts/validate-immutable-revision.mjs "$deploy_revision")"
            export EXPECTED_VERTEXED_REVISION="$expected_revision"
          else
            unset EXPECTED_VERTEXED_REVISION || true
          fi

          {
            echo "checked_at=${checked_at}"
            echo "target=${SMOKE_BASE_URL}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "expected_deploy_revision=${expected_revision}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } | tee "$log_path"

          for attempt in 1 2 3; do
            echo "[monitor] Attempt ${attempt}/3" | tee -a "$log_path"
            if node scripts/smoke-deploy.mjs 2>&1 | tee -a "$log_path"; then
              passed=1
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          {
            echo '# VertexED production health'
            echo
            echo "- Checked at: ${checked_at}"
            echo "- Base URL: ${SMOKE_BASE_URL}"
            echo "- Workflow commit: ${GITHUB_SHA}"
            echo "- Expected deploy revision: ${expected_revision}"
            echo "- Attempts allowed: 3"
            echo "- Result: $([ "$passed" -eq 1 ] && echo PASS || echo FAIL)"
            echo
            echo 'Coverage: deployed revision identity when running on main, health/router identity, API 404 behavior, homepage availability, malformed waitlist rejection, logged-out AI/user/admin protection, and untrusted-origin rejection.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$passed" -ne 1 ]; then
            exit 1
          fi

      - name: Upload probe evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-health-${{ github.run_id }}
          path: health-evidence/production-smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Open or update production incident
        if: github.event_name != 'pull_request' && steps.probe.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The scheduled public production smoke monitor failed after three bounded attempts.

          - Target: ${SMOKE_BASE_URL}
          - Latest failed run: ${run_url}
          - Evidence artifact: production-health-${GITHUB_RUN_ID}
          - Workflow commit: ${GITHUB_SHA}

          On main, the retained log also records the latest deploy-relevant revision derived from the same path contract used by the Vercel ignored-build guard and requires the live health endpoint to serve that exact immutable 40-character Git SHA. Review the evidence and production logs before changing or rolling back production. Authenticated product journeys remain tracked separately in issue #13.

          This incident body is updated in place on repeated failures so the hourly monitor does not flood the issue timeline with duplicate alerts. GitHub Actions and retained artifacts remain the chronological evidence trail.
          EOF

          issue_number="$(
            gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh api --method PATCH \
              "/repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              -f "body=$(cat "$body_file")" \
              >/dev/null
          else
            gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/issues" \
              -f "title=${INCIDENT_TITLE}" \
              -f "body=$(cat "$body_file")" \
              >/dev/null
          fi

      - name: Close recovered production incident
        if: github.event_name != 'pull_request' && steps.probe.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          issue_number="$(
            gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
              -f "body=Production smoke checks recovered successfully. Evidence: ${run_url}" \
              >/dev/null
            gh api --method PATCH \
              "/repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              -f state=closed \
              -f state_reason=completed \
              >/dev/null
          fi

      - name: Fail workflow when production is unhealthy
        if: github.event_name != 'pull_request' && steps.probe.outcome == 'failure'
        run: exit 1
