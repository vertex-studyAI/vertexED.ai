name: Production Health Monitor

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://www.vertexed.app
  INCIDENT_TITLE: Production health monitor failure

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Probe production homepage and health endpoint
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p health-evidence
          base_url="${PRODUCTION_BASE_URL%/}"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          failure=0

          probe_url() {
            local name="$1"
            local url="$2"
            local body="health-evidence/${name}.body"
            local headers="health-evidence/${name}.headers"
            local metrics="health-evidence/${name}.metrics"

            echo "[monitor] Probing ${url}"
            if ! curl \
              --silent \
              --show-error \
              --location \
              --fail-with-body \
              --connect-timeout 10 \
              --max-time 25 \
              --retry 2 \
              --retry-delay 2 \
              --retry-all-errors \
              --dump-header "$headers" \
              --output "$body" \
              --write-out $'%{http_code}\t%{time_total}\t%{url_effective}\n' \
              "$url" > "$metrics"; then
              echo "[monitor] ${name} request failed"
              failure=1
              return
            fi

            local status
            status="$(cut -f1 "$metrics")"
            if [ "$status" != "200" ]; then
              echo "[monitor] ${name} returned HTTP ${status}, expected 200"
              failure=1
            fi

            if [ ! -s "$body" ]; then
              echo "[monitor] ${name} returned an empty response body"
              failure=1
            fi
          }

          probe_url homepage "${base_url}/"
          probe_url health "${base_url}/api/health"

          if [ -s health-evidence/homepage.body ] && ! grep -qi 'VertexED' health-evidence/homepage.body; then
            echo "[monitor] Homepage response did not contain the VertexED product marker"
            failure=1
          fi

          if [ -s health-evidence/health.body ]; then
            if ! python3 - health-evidence/health.body <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)

          if payload.get("ok") is not True:
              raise SystemExit(f"health payload must contain ok=true, received: {payload!r}")
          PY
            then
              echo "[monitor] Health response was not valid JSON with ok=true"
              failure=1
            fi
          fi

          {
            echo "# VertexED production health"
            echo
            echo "- Checked at: ${started_at}"
            echo "- Base URL: ${base_url}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            for metrics in health-evidence/*.metrics; do
              [ -f "$metrics" ] || continue
              printf '%s: ' "$(basename "$metrics" .metrics)"
              cat "$metrics"
            done
            echo '```'
          } | tee health-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$failure" -ne 0 ]; then
            exit 1
          fi

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: health-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Open or update production incident
        if: steps.probe.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          The scheduled production monitor failed.

          - Checked URL: ${PRODUCTION_BASE_URL}
          - Failed run: ${run_url}
          - Evidence artifact: production-health-${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}

          Review the retained headers, bodies, and timing metrics before changing production. This monitor covers the public homepage and /api/health; authenticated product journeys remain tracked separately.
          EOF

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INCIDENT_TITLE" \
              --body-file "$body_file"
          fi

      - name: Close recovered production incident
        if: steps.probe.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Production probes recovered successfully. Evidence: ${run_url}"
          fi

      - name: Fail workflow when production is unhealthy
        if: steps.probe.outcome == 'failure'
        run: exit 1
