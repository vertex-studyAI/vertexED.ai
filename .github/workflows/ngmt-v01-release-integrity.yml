name: NGMT v0.1 release integrity
# Documentation/PDF integrity checks only; never runs scientific training.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'portfolio/research/ngmt/NGMT_V01_RELEASE_MANIFEST.json'
      - 'portfolio/research/ngmt/NGMT_V01_NEGATIVE_RESULT_MANUSCRIPT.md'
      - 'portfolio/research/ngmt/NGMT_V01_MANUSCRIPT_CLAIM_AUDIT.md'
      - 'scripts/generate-ngmt-v01-release-manifest.mjs'
      - 'scripts/render-ngmt-v01-paper.py'
      - 'tests/ngmt-v01-release-integrity.test.mjs'
      - '.github/workflows/ngmt-v01-release-integrity.yml'
  push:
    paths:
      - 'portfolio/research/ngmt/NGMT_V01_RELEASE_MANIFEST.json'
      - 'portfolio/research/ngmt/NGMT_V01_NEGATIVE_RESULT_MANUSCRIPT.md'
      - 'portfolio/research/ngmt/NGMT_V01_MANUSCRIPT_CLAIM_AUDIT.md'
      - 'scripts/generate-ngmt-v01-release-manifest.mjs'
      - 'scripts/render-ngmt-v01-paper.py'
      - 'tests/ngmt-v01-release-integrity.test.mjs'
      - '.github/workflows/ngmt-v01-release-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF inspection dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Render and verify deterministic negative-result PDF
        run: |
          mkdir -p portfolio/research/ngmt/paper /tmp/ngmt-v01-pdf
          python scripts/render-ngmt-v01-paper.py             portfolio/research/ngmt/NGMT_V01_NEGATIVE_RESULT_MANUSCRIPT.md             portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf
          python scripts/render-ngmt-v01-paper.py             portfolio/research/ngmt/NGMT_V01_NEGATIVE_RESULT_MANUSCRIPT.md             /tmp/ngmt-v01-pdf/second.pdf
          cmp portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf /tmp/ngmt-v01-pdf/second.pdf
          echo 'c2e5fbc0b9dd8f4a4752ac7f3f90a4b60238fa4383fe81ff03638fd2a8f7bcb9  portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf' | sha256sum -c -
          test "$(wc -c < portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf)" -eq 24292
          pdfinfo portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf | tee ngmt-v01-pdfinfo.txt
          pdffonts portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf | tee ngmt-v01-pdffonts.txt
          grep -Eq '^Pages:[[:space:]]+3$' ngmt-v01-pdfinfo.txt
          grep -Eq '^Encrypted:[[:space:]]+no$' ngmt-v01-pdfinfo.txt
          grep -Eq '^JavaScript:[[:space:]]+no$' ngmt-v01-pdfinfo.txt
          pdftotext portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf ngmt-v01-rendered.txt
          grep -F 'NEGATIVE_OR_INCONCLUSIVE_NGMT_V01' ngmt-v01-rendered.txt
          grep -F '0.4946%' ngmt-v01-rendered.txt
          grep -F '0.4393%' ngmt-v01-rendered.txt
          grep -F '0.9600%' ngmt-v01-rendered.txt
          grep -F 'Any successor requires a' ngmt-v01-rendered.txt
      - name: Verify deterministic manifest and frozen negative boundaries
        run: node --test tests/ngmt-v01-release-integrity.test.mjs | tee ngmt-v01-release-integrity.txt
      - name: Upload frozen negative-evidence checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ngmt-v01-negative-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            portfolio/research/ngmt/NGMT_V01_RELEASE_MANIFEST.json
            portfolio/research/ngmt/NGMT_V01_NEGATIVE_RESULT_MANUSCRIPT.md
            portfolio/research/ngmt/NGMT_V01_MANUSCRIPT_CLAIM_AUDIT.md
            portfolio/research/ngmt/paper/ngmt-v01-negative-result.pdf
            portfolio/research/ngmt/ngmt_v01_experiment_metadata.json
            portfolio/research/ngmt/ngmt_v01_replay_verification.json
            portfolio/research/ngmt/RESULTS.md
            ngmt-v01-release-integrity.txt
            ngmt-v01-pdfinfo.txt
            ngmt-v01-pdffonts.txt
            ngmt-v01-rendered.txt
