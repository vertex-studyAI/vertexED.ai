name: Refresh Dependency Lock

on:
  push:
    branches:
      - percy/vertex-production-monitor
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: refresh-dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: percy/vertex-production-monitor

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Refresh lockfile and verify production audit
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh patched dependency lockfile'
          git push origin HEAD:percy/vertex-production-monitor
