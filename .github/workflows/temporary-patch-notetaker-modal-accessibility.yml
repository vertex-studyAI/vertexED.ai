name: Temporary Patch Notetaker Modal Accessibility

on:
  push:
    branches:
      - percy/notetaker-modal-accessibility

permissions:
  contents: write

concurrency:
  group: temporary-patch-notetaker-modal-accessibility
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: percy/notetaker-modal-accessibility

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply guarded source patch
        run: node scripts/patch-notetaker-modal-accessibility.mjs

      - name: Validate patched source
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Commit patched Notetaker source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/pages/NotetakerQuiz.tsx; then
            echo "Notetaker source already patched."
            exit 0
          fi

          git config user.name "Percy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/NotetakerQuiz.tsx
          git commit -m "Use accessible dialogs for Notetaker study overlays"
          git push origin HEAD:percy/notetaker-modal-accessibility
