name: Temporary regenerate npm lockfile

on:
  push:
    branches:
      - chatgpt/fix-nanoid-audit-20260814

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chatgpt/fix-nanoid-audit-20260814
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Regenerate lockfile with npm
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit only generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          unexpected="$(git status --short | grep -vE '^( M|M |MM) package-lock\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate lock for nanoid 3.3.18"
          git push origin HEAD:chatgpt/fix-nanoid-audit-20260814
