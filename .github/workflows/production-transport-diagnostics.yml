name: Production Transport Diagnostics

on:
  workflow_run:
    workflows:
      - CI
      - Production Health Monitor
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-transport-diagnostics-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  diagnose:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
      - name: Checkout exact failed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact failed source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Capture DNS, TCP, TLS, and HTTPS evidence
        env:
          TRANSPORT_DIAGNOSTIC_URL: https://www.vertexed.app
          TRANSPORT_DIAGNOSTIC_TIMEOUT_MS: '10000'
          TRANSPORT_DIAGNOSTIC_OUTPUT: artifacts/production-transport/transport.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-transport
          {
            echo "trigger_workflow=${{ github.event.workflow_run.name || 'manual' }}"
            echo "trigger_run_id=${{ github.event.workflow_run.id || github.run_id }}"
            echo "trigger_conclusion=${{ github.event.workflow_run.conclusion || 'manual' }}"
            echo "trigger_head_sha=${SOURCE_SHA}"
          } > artifacts/production-transport/context.txt
          node scripts/diagnose-production-transport.mjs \
            | tee artifacts/production-transport/transport.log

      - name: Summarize retained diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo '# VertexED production transport diagnostic'
            echo
            echo "- Trigger workflow: ${{ github.event.workflow_run.name || 'manual' }}"
            echo "- Trigger conclusion: ${{ github.event.workflow_run.conclusion || 'manual' }}"
            echo "- Exact source: ${SOURCE_SHA}"
            echo '- Layers captured: DNS address lookup plus bounded CNAME chain, TCP connect, authenticated TLS handshake, HTTPS `/api/health`.'
            echo '- This workflow observes transport only; it does not deploy, mutate production, or weaken health/revision checks.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f artifacts/production-transport/transport.json ]]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';

          const report = JSON.parse(await readFile('artifacts/production-transport/transport.json', 'utf8'));
          const clean = (value) => String(value ?? '')
            .replaceAll('\r', ' ')
            .replaceAll('\n', ' ')
            .replaceAll('|', '\\|')
            .slice(0, 240);
          const networkStatus = (layer) => {
            if (!layer) return 'not captured';
            if (layer.ok) return 'ok';
            return `failed: ${clean(layer.error || 'unknown error')}`;
          };
          const httpsStatus = (layer) => {
            if (!layer) return 'not captured';
            if (!layer.ok) return `failed: ${clean(layer.error || 'unknown error')}`;
            return `reachable: HTTP ${clean(layer.status ?? 'unknown')}`;
          };

          console.log('');
          console.log('## Captured result');
          console.log('');
          console.log(`- Target: ${clean(report.target || 'unknown')}`);
          console.log(`- DNS: ${networkStatus(report.layers?.dns)}`);
          console.log(`- Hostname TCP: ${networkStatus(report.layers?.tcp)}`);
          console.log(`- Hostname TLS: ${networkStatus(report.layers?.tls)}`);
          console.log(`- Hostname HTTPS: ${httpsStatus(report.layers?.https)}`);
          console.log('');
          console.log('| Address | Family | TCP | TLS | HTTPS |');
          console.log('| --- | --- | --- | --- | --- |');

          const perAddress = report.layers?.perAddress || [];
          if (perAddress.length === 0) {
            console.log('| none resolved | — | — | — | — |');
          } else {
            for (const entry of perAddress) {
              console.log(`| ${clean(entry.address)} | ${clean(entry.family)} | ${networkStatus(entry.tcp)} | ${networkStatus(entry.tls)} | ${httpsStatus(entry.https)} |`);
            }
          }
          NODE
          else
            {
              echo
              echo '## Captured result'
              echo
              echo '- Structured transport payload was not produced; inspect the capture step and retained context artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vertexed-production-transport-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/production-transport
          if-no-files-found: error
          retention-days: 14
