name: Production Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-monitor.yml'
      - 'scripts/smoke-deploy.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-monitor.yml'
      - 'scripts/smoke-deploy.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: vertex-production-monitor
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run production smoke checks
        id: smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: https://www.vertexed.app
          SMOKE_TIMEOUT_MS: '20000'
        run: |
          set -o pipefail
          node scripts/smoke-deploy.mjs 2>&1 | tee production-monitor.log

      - name: Upload failure evidence
        if: always() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: production-monitor-${{ github.run_id }}
          path: production-monitor.log
          if-no-files-found: error
          retention-days: 7

      - name: Open, update, or resolve production incident
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          title='[monitor] VertexED production smoke failure'
          existing_issue="$(
            gh issue list \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[monitor] VertexED production smoke failure") | .number' \
              | head -n 1
          )"

          if [ "$SMOKE_OUTCOME" = 'failure' ]; then
            cat > monitor-note.md <<EOF
          Automated production smoke checks failed.

          - Workflow run: $RUN_URL
          - Tested repository commit: \`$TESTED_SHA\`
          - Target: \`https://www.vertexed.app\`
          - Time: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`

          The workflow artifact contains the non-secret smoke output. Keep this issue open until a later monitor run confirms recovery.
          EOF

            if [ -n "$existing_issue" ]; then
              gh issue comment "$existing_issue" --body-file monitor-note.md
            else
              gh issue create --title "$title" --body-file monitor-note.md
            fi
          elif [ -n "$existing_issue" ]; then
            cat > recovery-note.md <<EOF
          Automated production smoke checks recovered.

          - Workflow run: $RUN_URL
          - Tested repository commit: \`$TESTED_SHA\`
          - Recovery time: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          EOF

            gh issue comment "$existing_issue" --body-file recovery-note.md
            gh issue close "$existing_issue" --reason completed
          fi

      - name: Fail workflow when production checks fail
        if: steps.smoke.outcome == 'failure'
        run: exit 1
