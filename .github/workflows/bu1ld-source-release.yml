name: Bu1LD Source Release Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bu1ld-source-release.yml'
      - 'portfolio/bu1ld/SOURCE_RELEASE_CERTIFICATION.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bu1ld-source-release.yml'
      - 'portfolio/bu1ld/SOURCE_RELEASE_CERTIFICATION.md'

permissions:
  contents: read

concurrency:
  group: bu1ld-source-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout portfolio control repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Checkout immutable Bu1LD source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: ryangomez010/bu1ld-landing
          ref: daa80c1124b2a6d7d09b7669e04d29e50cffcbbe
          path: target

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Record immutable inputs
        run: |
          set -euo pipefail
          target_sha="$(git -C target rev-parse HEAD)"
          test "$target_sha" = 'daa80c1124b2a6d7d09b7669e04d29e50cffcbbe'
          test "$(bun --version)" = '1.3.14'
          {
            echo "target_commit=$target_sha"
            echo "bun_version=$(bun --version)"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "public_config=synthetic non-secret CI values"
          } | tee bu1ld-source-environment.log

      - name: Install frozen dependencies
        working-directory: target
        run: bun install --frozen-lockfile

      - name: Run repository release check
        working-directory: target
        env:
          VITE_SUPABASE_URL: https://bu1ld-ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key-build-only
        run: |
          set -o pipefail
          bun run release:check 2>&1 | tee "$GITHUB_WORKSPACE/bu1ld-source-release.log"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Bu1LD immutable source release certification'
            echo
            echo '- Repository: ryangomez010/bu1ld-landing'
            echo '- Commit: daa80c1124b2a6d7d09b7669e04d29e50cffcbbe'
            echo '- Bun: 1.3.14'
            echo '- Command: bun run release:check'
            echo '- Public build configuration: explicit synthetic non-secret CI values; no production project or key used'
            echo '- Scope: typecheck, tests, lint, build, copy/security scans, migration and release-artifact checks'
            echo '- Boundary: does not run strict production schema/RLS checks or authenticated deployed journeys'
            echo '- Evidence: bu1ld-source-release-${{ github.run_id }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bu1ld-source-release-${{ github.run_id }}
          path: |
            bu1ld-source-environment.log
            bu1ld-source-release.log
          if-no-files-found: ignore
          retention-days: 14
