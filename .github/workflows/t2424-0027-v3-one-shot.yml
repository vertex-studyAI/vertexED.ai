name: T2424-0027 v3 One-shot Outcome Execution

on:
  push:
    branches:
      - "experiment/t2424-0027-v3-authorization-20260830"
    paths:
      - "portfolio/project2424/projects/T2424-0027/real_encoder/EXECUTE_V3_ONCE.json"

permissions:
  contents: read

concurrency:
  group: t2424-0027-v3-primary-one-shot
  cancel-in-progress: false

jobs:
  execute-primary:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify one-shot trigger binding
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          trigger = json.loads(Path("portfolio/project2424/projects/T2424-0027/real_encoder/EXECUTE_V3_ONCE.json").read_text())
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if trigger.get("execution_id") != "T2424-0027-v3-primary-20260830":
              raise SystemExit("unexpected execution_id")
          if trigger.get("authorized_source_commit") != parent:
              raise SystemExit(f"trigger/source mismatch: trigger={trigger.get('authorized_source_commit')} parent={parent}")
          if trigger.get("authorization_lock_run") != 33307242105:
              raise SystemExit("trigger is not bound to the green authorization-lock run")
          if trigger.get("execution_kind") != "PRIMARY_FROZEN_OUTCOME_EXECUTION":
              raise SystemExit("execution kind is not the one authorized primary run")
          print("PASS: trigger is bound to the exact pre-outcome source commit")
          PY
      - name: Install frozen execution environment
        run: python -m pip install -r portfolio/project2424/projects/T2424-0027/real_encoder/requirements.txt
      - name: Execute frozen v3 protocol exactly once
        run: |
          python portfolio/project2424/projects/T2424-0027/real_encoder/execute_v3_once.py \
            --manifest /tmp/t2424-0027-v3-execution.json \
            --out portfolio/project2424/projects/T2424-0027/real_encoder/artifacts_v3
      - name: Retain all primary execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2424-0027-v3-primary-${{ github.sha }}
          path: |
            portfolio/project2424/projects/T2424-0027/real_encoder/artifacts_v3
            portfolio/project2424/projects/T2424-0027/real_encoder/AUTHORIZATION_V3.json
            portfolio/project2424/projects/T2424-0027/real_encoder/EXECUTE_V3_ONCE.json
            /tmp/t2424-0027-v3-execution.json
          if-no-files-found: warn
          retention-days: 90
