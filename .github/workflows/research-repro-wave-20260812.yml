name: Research Reproducibility Wave 2026-08-12

# The first frozen reproduction was executed successfully as run 31616762393.
# 2026-08-13 expansion: preserve the original frozen screens and add the next
# requested current-main Project 2424 mechanics packages plus an evidence hash
# manifest. This runner change is itself the explicit trigger for execution.
# Documentation-only commits must not silently rerun experiments.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-repro-wave-20260812.yml'

permissions:
  contents: read

jobs:
  project2424-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture environment
        run: |
          mkdir -p reproducibility-wave/raw
          node --version | tee reproducibility-wave/node-version.txt
          npm --version | tee reproducibility-wave/npm-version.txt
          uname -a | tee reproducibility-wave/uname.txt
          git rev-parse HEAD | tee reproducibility-wave/commit.txt
      - name: T2424-0025 frozen screen
        run: node portfolio/project2424/projects/T2424-0025/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0025-screen.json
      - name: T2424-0025 fixed 50-seed ablation
        run: node portfolio/project2424/projects/T2424-0025/experiment/ablation.mjs | tee reproducibility-wave/raw/T2424-0025-ablation.json
      - name: T2424-0025 canonical-schema verifier
        run: |
          node - <<'NODE' | tee reproducibility-wave/raw/T2424-0025-verification.json
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('reproducibility-wave/raw/T2424-0025-screen.json'));
          const a = JSON.parse(fs.readFileSync('reproducibility-wave/raw/T2424-0025-ablation.json'));
          if (s.verdict !== 'PASS_HEAVY_TAIL_MEMORY_SCREEN') process.exit(1);
          if (a.sweep?.seeds !== 50) process.exit(1);
          const zero = a.sweep.rows.find((r) => r.contaminationRate === 0);
          if (!zero || !(zero.metrics.median.mean < zero.metrics.mean.mean)) process.exit(1);
          console.log(JSON.stringify({
            screen_verdict: s.verdict,
            ablation_seeds: a.sweep.seeds,
            zero_contamination_negative_control: 'ROBUST_READOUT_STILL_BETTER',
            verifier_schema: 'canonical sweep schema'
          }, null, 2));
          NODE
      - name: T2424-0025 focused tests
        run: node --test tests/project2424NonGaussianMemory.test.mjs tests/project2424NonGaussianMemoryAblation.test.mjs
      - name: T2424-0027 frozen latent-language diagnostic
        run: |
          node portfolio/project2424/projects/T2424-0027/experiment/run.mjs reproducibility-wave/raw/T2424-0027-results.json
          node portfolio/project2424/projects/T2424-0027/reproduction/verify.mjs | tee reproducibility-wave/T2424-0027-verify.log
          node --test tests/project2424LatentLanguageAudit.test.mjs
      - name: T2424-0028 frozen residual-event tokenization screen
        run: |
          node portfolio/project2424/projects/T2424-0028/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0028-residual-events.json
          node --test tests/residualEventTokenization.test.mjs | tee reproducibility-wave/T2424-0028-tests.log
      - name: T2424-0029 frozen PDE-transition screen
        run: |
          node portfolio/project2424/projects/T2424-0029/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0029-pde-transitions.json
          node --test tests/pdeRepresentationTransitions.test.mjs | tee reproducibility-wave/T2424-0029-tests.log
      - name: T2424-0037 frozen 20-case NeuroCAD benchmark
        run: |
          node portfolio/project2424/projects/T2424-0037/benchmark/run.mjs | tee reproducibility-wave/raw/T2424-0037-benchmark.json
          node --test tests/nlpToCad.test.mjs tests/nlpToCadBenchmark.test.mjs
      - name: T2424-0050 frozen Darcy screen
        run: |
          node portfolio/project2424/projects/T2424-0050/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0050-darcy.json
          node --test tests/project2424DarcyLatentOperator.test.mjs
      - name: T2424-0024 synthetic evaluator-mechanics reproduction
        run: |
          node portfolio/project2424/projects/T2424-0024/experiment/run.mjs
          cp portfolio/project2424/projects/T2424-0024/evidence/results.json reproducibility-wave/raw/T2424-0024-results.json
          node --test tests/project2424TrustUnderUncertainty.test.mjs tests/project2424TrustUnderUncertaintyQa.test.mjs | tee reproducibility-wave/T2424-0024-tests.log
      - name: T2424-0026 counterfactual defect-world mechanics
        run: |
          node portfolio/project2424/projects/T2424-0026/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0026-results.json
          node --test tests/counterfactualDefectWorlds.test.mjs | tee reproducibility-wave/T2424-0026-tests.log
      - name: T2424-0035 delayed-generalization detector
        run: |
          node portfolio/project2424/projects/T2424-0035/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0035-results.json
          node --test tests/grokkingAgent.test.mjs | tee reproducibility-wave/T2424-0035-tests.log
      - name: T2424-0040 prerequisite-aware learning-graph mechanics
        run: |
          node portfolio/project2424/projects/T2424-0040/experiment/run.mjs
          cp portfolio/project2424/projects/T2424-0040/evidence/results.json reproducibility-wave/raw/T2424-0040-results.json
          node portfolio/project2424/projects/T2424-0040/reproduction/verify.mjs | tee reproducibility-wave/T2424-0040-verify.log
          node --test tests/project2424FinanceMetaLearningGraph.test.mjs | tee reproducibility-wave/T2424-0040-tests.log
      - name: T2424-0054 theory-manifold planner mechanics
        run: |
          node portfolio/project2424/projects/T2424-0054/experiment/run.mjs | tee reproducibility-wave/raw/T2424-0054-results.json
          node --test tests/theoryManifoldExperimentPlanner.test.mjs | tee reproducibility-wave/T2424-0054-tests.log
      - name: T2424-1768 self-verifying MoE synthetic screen
        run: |
          node portfolio/project2424/projects/T2424-1768/experiment/syntheticBenchmark.mjs | tee reproducibility-wave/raw/T2424-1768-results.json
          node --test tests/project2424T1768SelfVerifyingMoe.test.mjs | tee reproducibility-wave/T2424-1768-tests.log
      - name: Hash retained wave evidence
        run: |
          find reproducibility-wave -type f -print0 | sort -z | xargs -0 sha256sum | tee reproducibility-wave/SHA256SUMS.txt
      - name: Upload raw reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-repro-wave-20260813-current-main
          path: reproducibility-wave/
          if-no-files-found: error
