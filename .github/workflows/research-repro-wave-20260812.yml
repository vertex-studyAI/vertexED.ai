name: Research Reproducibility Wave 2026-08-12

# The first frozen reproduction was executed successfully as run 31616762393.
# 2026-08-13 expansion: preserve the original frozen screens and add the next
# requested current-main Project 2424 mechanics packages plus an evidence hash
# manifest. This runner change is itself the explicit trigger for execution.
# Documentation-only commits must not silently rerun experiments.
# 2026-08-13 hardening: fail closed through tee pipelines and retain per-command
# wall timings. Scientific implementations, fixtures, seeds, metrics and gates
# are unchanged.
# 2026-08-29 pending-wave expansion: add the source-backed NPMS recovery validator
# and T2424-1767 resource-bounded MoE smoke benchmark. This does not authorize a
# successor study or upgrade either package beyond its existing claim boundary.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-repro-wave-20260812.yml'

permissions:
  contents: read

concurrency:
  group: research-repro-wave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project2424-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Capture environment
        run: |
          set -euo pipefail
          mkdir -p reproducibility-wave/raw reproducibility-wave/timing
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_sha=${{ github.sha }}"
            echo "workflow_ref=${{ github.workflow_ref }}"
            echo "runner_image=ubuntu-24.04"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -a)"
            echo "cpu_count=$(getconf _NPROCESSORS_ONLN)"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee reproducibility-wave/environment.txt

      - name: T2424-0019 recovered NPMS evidence validator
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0019-recovery.time \
            node portfolio/project2424/projects/T2424-0019/experiment/validate_recovery.mjs \
            | tee reproducibility-wave/raw/T2424-0019-recovery-validation.json
          sha256sum portfolio/project2424/projects/T2424-0019/evidence/recovered_experiment_report.json \
            | tee reproducibility-wave/raw/T2424-0019-recovered-report.sha256

      - name: T2424-0025 frozen screen
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0025-screen.time \
            node portfolio/project2424/projects/T2424-0025/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0025-screen.json

      - name: T2424-0025 fixed 50-seed ablation
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0025-ablation.time \
            node portfolio/project2424/projects/T2424-0025/experiment/ablation.mjs \
            | tee reproducibility-wave/raw/T2424-0025-ablation.json

      - name: T2424-0025 canonical-schema verifier
        run: |
          set -euo pipefail
          node - <<'NODE' | tee reproducibility-wave/raw/T2424-0025-verification.json
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('reproducibility-wave/raw/T2424-0025-screen.json'));
          const a = JSON.parse(fs.readFileSync('reproducibility-wave/raw/T2424-0025-ablation.json'));
          if (s.verdict !== 'PASS_HEAVY_TAIL_MEMORY_SCREEN') process.exit(1);
          if (a.sweep?.seeds !== 50) process.exit(1);
          const zero = a.sweep.rows.find((r) => r.contaminationRate === 0);
          if (!zero || !(zero.metrics.median.mean < zero.metrics.mean.mean)) process.exit(1);
          console.log(JSON.stringify({
            screen_verdict: s.verdict,
            ablation_seeds: a.sweep.seeds,
            zero_contamination_negative_control: 'ROBUST_READOUT_STILL_BETTER',
            verifier_schema: 'canonical sweep schema'
          }, null, 2));
          NODE

      - name: T2424-0025 focused tests
        run: |
          set -euo pipefail
          node --test tests/project2424NonGaussianMemory.test.mjs tests/project2424NonGaussianMemoryAblation.test.mjs \
            | tee reproducibility-wave/T2424-0025-tests.log

      - name: T2424-0027 frozen latent-language diagnostic
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0027.time \
            node portfolio/project2424/projects/T2424-0027/experiment/run.mjs reproducibility-wave/raw/T2424-0027-results.json
          node portfolio/project2424/projects/T2424-0027/reproduction/verify.mjs \
            | tee reproducibility-wave/T2424-0027-verify.log
          node --test tests/project2424LatentLanguageAudit.test.mjs \
            | tee reproducibility-wave/T2424-0027-tests.log

      - name: T2424-0028 frozen residual-event tokenization screen
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0028.time \
            node portfolio/project2424/projects/T2424-0028/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0028-residual-events.json
          node --test tests/residualEventTokenization.test.mjs \
            | tee reproducibility-wave/T2424-0028-tests.log

      - name: T2424-0029 frozen PDE-transition screen
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0029.time \
            node portfolio/project2424/projects/T2424-0029/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0029-pde-transitions.json
          node --test tests/pdeRepresentationTransitions.test.mjs \
            | tee reproducibility-wave/T2424-0029-tests.log

      - name: T2424-0037 frozen 20-case NeuroCAD benchmark
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0037.time \
            node portfolio/project2424/projects/T2424-0037/benchmark/run.mjs \
            | tee reproducibility-wave/raw/T2424-0037-benchmark.json
          node --test tests/nlpToCad.test.mjs tests/nlpToCadBenchmark.test.mjs \
            | tee reproducibility-wave/T2424-0037-tests.log

      - name: T2424-0050 frozen Darcy screen
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0050.time \
            node portfolio/project2424/projects/T2424-0050/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0050-darcy.json
          node --test tests/project2424DarcyLatentOperator.test.mjs \
            | tee reproducibility-wave/T2424-0050-tests.log

      - name: T2424-0024 synthetic evaluator-mechanics reproduction
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0024.time \
            node portfolio/project2424/projects/T2424-0024/experiment/run.mjs
          cp portfolio/project2424/projects/T2424-0024/evidence/results.json reproducibility-wave/raw/T2424-0024-results.json
          node --test tests/project2424TrustUnderUncertainty.test.mjs tests/project2424TrustUnderUncertaintyQa.test.mjs \
            | tee reproducibility-wave/T2424-0024-tests.log

      - name: T2424-0026 counterfactual defect-world mechanics
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0026.time \
            node portfolio/project2424/projects/T2424-0026/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0026-results.json
          node --test tests/counterfactualDefectWorlds.test.mjs \
            | tee reproducibility-wave/T2424-0026-tests.log

      - name: T2424-0035 delayed-generalization detector
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0035.time \
            node portfolio/project2424/projects/T2424-0035/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0035-results.json
          node --test tests/grokkingAgent.test.mjs \
            | tee reproducibility-wave/T2424-0035-tests.log

      - name: T2424-0040 prerequisite-aware learning-graph mechanics
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0040.time \
            node portfolio/project2424/projects/T2424-0040/experiment/run.mjs
          cp portfolio/project2424/projects/T2424-0040/evidence/results.json reproducibility-wave/raw/T2424-0040-results.json
          node portfolio/project2424/projects/T2424-0040/reproduction/verify.mjs \
            | tee reproducibility-wave/T2424-0040-verify.log
          node --test tests/project2424FinanceMetaLearningGraph.test.mjs \
            | tee reproducibility-wave/T2424-0040-tests.log

      - name: T2424-0054 theory-manifold planner mechanics
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-0054.time \
            node portfolio/project2424/projects/T2424-0054/experiment/run.mjs \
            | tee reproducibility-wave/raw/T2424-0054-results.json
          node --test tests/theoryManifoldExperimentPlanner.test.mjs \
            | tee reproducibility-wave/T2424-0054-tests.log

      - name: T2424-1767 resource-bounded MoE smoke benchmark
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-1767.time \
            node portfolio/project2424/projects/T2424-1767/experiment/syntheticBenchmark.mjs \
            | tee reproducibility-wave/raw/T2424-1767-results.json
          node --test tests/project2424T1767ResourceBoundedMoe.test.mjs \
            | tee reproducibility-wave/T2424-1767-tests.log
          sha256sum reproducibility-wave/raw/T2424-1767-results.json \
            | tee reproducibility-wave/raw/T2424-1767-results.sha256

      - name: T2424-1768 self-verifying MoE synthetic screen
        run: |
          set -euo pipefail
          /usr/bin/time -p -o reproducibility-wave/timing/T2424-1768.time \
            node portfolio/project2424/projects/T2424-1768/experiment/syntheticBenchmark.mjs \
            | tee reproducibility-wave/raw/T2424-1768-results.json
          node --test tests/project2424T1768SelfVerifyingMoe.test.mjs \
            | tee reproducibility-wave/T2424-1768-tests.log

      - name: Finalize evidence manifest
        if: always()
        run: |
          set -euo pipefail
          echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee reproducibility-wave/completed.txt
          find reproducibility-wave -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee reproducibility-wave/SHA256SUMS.txt

      - name: Upload raw reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: research-repro-wave-${{ github.sha }}
          path: reproducibility-wave/
          if-no-files-found: error
