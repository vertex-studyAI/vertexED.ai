name: Diagnose Notebook 733

on:
  push:
    branches:
      - fix/notebook-generated-content-a11y-main2-20260906

permissions:
  contents: read

jobs:
  isolate-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run every Node test file independently
        id: isolate
        shell: bash
        run: |
          set +e
          : > /tmp/failing-tests.txt
          failures=0
          for file in tests/*.test.mjs; do
            node --test "$file" >/tmp/one-test.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "$file" | tee -a /tmp/failing-tests.txt
              cat /tmp/one-test.log
              failures=$((failures + 1))
            fi
          done
          echo "failure_count=$failures" >> "$GITHUB_OUTPUT"
          exit "$([ "$failures" -eq 0 ] && echo 0 || echo 1)"
      - name: Upload failing test filenames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-733-failing-tests
          path: /tmp/failing-tests.txt
          if-no-files-found: error

  validate-serverless-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:serverless:functions

  validate-function-sizes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:function-sizes
