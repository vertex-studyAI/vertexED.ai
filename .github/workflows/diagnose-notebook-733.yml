name: Diagnose Notebook 733

on:
  push:
    branches:
      - fix/notebook-generated-content-a11y-main2-20260906

permissions:
  contents: read

jobs:
  capture-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Capture failing Node test logs
        shell: bash
        run: |
          set +e
          : > /tmp/failing-tests.txt
          : > /tmp/failing-test-logs.txt
          for file in tests/*.test.mjs; do
            node --test "$file" >/tmp/one-test.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "$file" >> /tmp/failing-tests.txt
              printf '\n===== %s =====\n' "$file" >> /tmp/failing-test-logs.txt
              cat /tmp/one-test.log >> /tmp/failing-test-logs.txt
            fi
          done
          exit 0
      - name: Capture serverless validator logs
        shell: bash
        run: |
          set +e
          npm run validate:serverless:functions >/tmp/serverless-functions.log 2>&1
          npm run validate:function-sizes >/tmp/function-sizes.log 2>&1
          exit 0
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: notebook-733-diagnostic-logs
          path: |
            /tmp/failing-tests.txt
            /tmp/failing-test-logs.txt
            /tmp/serverless-functions.log
            /tmp/function-sizes.log
          if-no-files-found: error
