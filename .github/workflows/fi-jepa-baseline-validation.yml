name: FI-JEPA baseline validation

on:
  push:
    branches:
      - percy/fi-jepa-baseline-20260805

permissions:
  contents: write

concurrency:
  group: fi-jepa-baseline-recovery
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable recovery source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout immutable target
        uses: actions/checkout@v5
        with:
          repository: build-the-future-11/FinanceMeta-Global
          ref: 6191c2bc98118709b3437e04666af4b51a96ee65
          path: target

      - name: Apply baseline overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -R portfolio/patches/finance-meta-global-fi-jepa/overlay/. target/
          rm -f target/FI-JEPA/init.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: target/FI-JEPA/pyproject.toml

      - name: Install baseline
        run: python -m pip install -e 'target/FI-JEPA[dev]'

      - name: Run leakage and reproducibility tests
        run: pytest target/FI-JEPA/tests -q | tee fi-jepa-tests.log

      - name: Run synthetic experiment
        run: python -m fi_jepa.cli --epochs 40 | tee fi-jepa-report.json

      - name: Build certified target patch
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/portfolio/patches/finance-meta-global-fi-jepa"
          target="$GITHUB_WORKSPACE/target"
          target_sha="$(git -C "$target" rev-parse HEAD)"
          test "$target_sha" = "6191c2bc98118709b3437e04666af4b51a96ee65"
          git -C "$target" add -A
          git -C "$target" diff --cached --binary > "$bundle/fi-jepa-baseline.patch"
          test -s "$bundle/fi-jepa-baseline.patch"
          patch_sha="$(sha256sum "$bundle/fi-jepa-baseline.patch" | awk '{print $1}')"
          report_sha="$(sha256sum fi-jepa-report.json | awk '{print $1}')"
          cat > "$bundle/VALIDATION.md" <<EOF
          # FI-JEPA baseline validation

          - Target: \`build-the-future-11/FinanceMeta-Global\`
          - Target base: \`$target_sha\`
          - Execution commit: \`$GITHUB_SHA\`
          - Validation run: \`$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\`
          - Python: \`$(python --version 2>&1)\`
          - Patch SHA-256: \`$patch_sha\`
          - Report SHA-256: \`$report_sha\`

          Passed four tests covering deterministic data, disjoint chronological windows, objective reduction, non-collapsed embeddings, finite frozen-probe metrics, and deterministic CLI reporting. The synthetic experiment completed successfully. This validates execution only; it is not evidence of novelty, real-market performance, or profitability.
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fi-jepa-baseline-validation-${{ github.run_id }}
          path: |
            fi-jepa-tests.log
            fi-jepa-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve certified patch
        shell: bash
        run: |
          set -euo pipefail
          branch="percy/fi-jepa-baseline-20260805"
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r portfolio/patches/finance-meta-global-fi-jepa/overlay
          git rm .github/workflows/fi-jepa-baseline-validation.yml
          git add portfolio/patches/finance-meta-global-fi-jepa/fi-jepa-baseline.patch
          git add portfolio/patches/finance-meta-global-fi-jepa/VALIDATION.md
          git commit -m "test: certify FI-JEPA synthetic baseline"
          git push origin "HEAD:$branch"
