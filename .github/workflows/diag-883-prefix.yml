name: Diagnose #883 app tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-883-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sequential-app-tests:
    name: sequential app tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run every app test file sequentially
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -type f -name '*.test.mjs' | sort)
          for file in "${files[@]}"; do
            case "$file" in
              tests/apex-companion-legacy.test.mjs|tests/study-groups-authz-api.test.mjs|tests/study-groups-enterprise-contract.test.mjs|tests/study-groups-relationship-state.test.mjs)
                echo "Skipping quarantined $file"
                continue
                ;;
            esac
            echo "::group::$file"
            if ! node --test "$file"; then
              echo "::error title=Sequential app test failure::$file failed independently"
              echo "FAILED_TEST=$file"
              exit 1
            fi
            echo "::endgroup::"
          done
