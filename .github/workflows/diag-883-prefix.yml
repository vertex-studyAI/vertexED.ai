name: Diagnose #883 app tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-883-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-app-test:
    name: changed-app-test (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file:
          - ai-model-policy.test.mjs
          - apex-cancel-contract.test.mjs
          - provider-telemetry.test.mjs
          - review-vision.test.mjs
          - same-origin-api.test.mjs
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run changed test in isolation
        run: node --test "tests/${{ matrix.file }}"
