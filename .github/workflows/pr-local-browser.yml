name: PR Local Browser

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'playwright.config.*'
      - '.github/workflows/pr-local-browser.yml'

permissions:
  contents: read

concurrency:
  group: pr-local-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-pr-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pull-request bundle
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify the built pull-request UI
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_API_URL: https://www.vertexed.app
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > preview-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Local preview did not become ready.'
              cat preview-server.log
              exit 1
            fi
            sleep 1
          done

          npm run test:e2e

      - name: Upload pull-request browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pr-build-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            preview-server.log
          if-no-files-found: ignore
          retention-days: 14
