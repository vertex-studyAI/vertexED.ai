name: NeuroCAD Alpha public Pages deployment

on:
  push:
    branches: [main, master]
    paths:
      - 'portfolio/project2424/projects/T2424-0037/**'
      - 'scripts/publish-neurocad-alpha.mjs'
      - 'tests/neurocadProductQa.test.mjs'
      - 'tests/neurocadPublicRoute.test.mjs'
      - 'e2e/neurocad-alpha.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/neurocad-alpha-pages.yml'
      - '.github/workflows/neurocad-alpha-browser.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neurocad-alpha-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact NeuroCAD release artifact
        run: npm run build:ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'

      - name: Verify stamped artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/neurocad/index.html
          test -f dist/neurocad/release-manifest.json
          page="$(cat dist/neurocad/index.html)"
          printf '%s' "$page" | grep -Fq "neurocad-build-revision\" content=\"${GITHUB_SHA}\""
          artifact_revision="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const m=JSON.parse(await readFile('dist/neurocad/release-manifest.json','utf8')); process.stdout.write(m.artifactRevision);")"
          printf '%s' "$page" | grep -Fq "neurocad-artifact-revision\" content=\"${artifact_revision}\""
          echo "[pages] exact NeuroCAD artifact ${artifact_revision} stamped from ${GITHUB_SHA}"

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/neurocad
          cp -R dist/neurocad/. _site/neurocad/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./neurocad/">
          <title>NeuroCAD Alpha</title>
          <a href="./neurocad/">Open NeuroCAD Alpha</a>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy NeuroCAD Alpha to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
