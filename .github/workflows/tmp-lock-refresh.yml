name: Temporary audited lock refresh

on:
  push:
    branches:
      - chatgpt/portfolio-state-security-20260814

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/portfolio-state-security-20260814
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify fixed resolution and production audit
        run: |
          node -e "const l=require('./package-lock.json'); const n=l.packages['node_modules/nanoid']; if(n.version!=='3.3.18') throw new Error('unexpected nanoid '+n.version); console.log(n)"
          npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/tmp-lock-refresh.yml
          git commit -m "security: refresh lockfile for nanoid 3.3.18"
          git push origin HEAD:chatgpt/portfolio-state-security-20260814
