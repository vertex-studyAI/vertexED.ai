name: Dependency Lockfile Refresh

on:
  push:
    branches:
      - percy/vertex-production-monitor
    paths:
      - package.json
      - .github/workflows/dependency-lockfile-refresh.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/dependency-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: vertex-dependency-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve source branch
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "name=${HEAD_REF:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Reconcile package manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh affected transitive dependencies
        run: npm update brace-expansion fast-uri ip-address hono --package-lock-only --ignore-scripts

      - name: Install refreshed dependency graph
        run: npm ci

      - name: Run canonical release gate
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'
        run: npm run ci

      - name: Commit verified lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes were required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: refresh dependency lockfile [skip dependency refresh]'
          git push origin HEAD:${{ steps.branch.outputs.name }}
