name: Research Reproducibility Wave

# Scientific evidence for this wave is frozen at workflow run 31659677450.
# Future reruns are explicit/manual so documentation-only commits cannot silently
# create a new scientific evidence lineage.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup repository-conformant Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'

      - name: Capture environment
        run: |
          set -euo pipefail
          mkdir -p repro-evidence
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -srmo)"
            echo "cpu_count=$(getconf _NPROCESSORS_ONLN)"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee repro-evidence/environment.txt

      - name: Reproduce T2424-0025 robust-readout screen
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0025/experiment/run.mjs > repro-evidence/T2424-0025-screen.json; } 2> repro-evidence/T2424-0025-screen.time
          { time -p node portfolio/project2424/projects/T2424-0025/experiment/ablation.mjs > repro-evidence/T2424-0025-ablation.json; } 2> repro-evidence/T2424-0025-ablation.time
          node --test tests/project2424NonGaussianMemory.test.mjs tests/project2424NonGaussianMemoryAblation.test.mjs | tee repro-evidence/T2424-0025-tests.log

      - name: Reproduce T2424-0027 latent-language synthetic audit
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0027/experiment/run.mjs repro-evidence/T2424-0027-results.json; } 2> repro-evidence/T2424-0027.time
          node portfolio/project2424/projects/T2424-0027/reproduction/verify.mjs | tee repro-evidence/T2424-0027-verify.log
          node --test tests/project2424LatentLanguageAudit.test.mjs | tee repro-evidence/T2424-0027-tests.log

      - name: Reproduce T2424-0028 residual-event tokenization
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0028/experiment/run.mjs > repro-evidence/T2424-0028-residual-events.json; } 2> repro-evidence/T2424-0028.time
          node --test tests/residualEventTokenization.test.mjs | tee repro-evidence/T2424-0028-tests.log

      - name: Reproduce T2424-0029 PDE representation transitions
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0029/experiment/run.mjs > repro-evidence/T2424-0029-pde-transitions.json; } 2> repro-evidence/T2424-0029.time
          node --test tests/pdeRepresentationTransitions.test.mjs | tee repro-evidence/T2424-0029-tests.log

      - name: Reproduce T2424-0024 trust-under-uncertainty evaluator
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0024/experiment/run.mjs > repro-evidence/T2424-0024-trust.json; } 2> repro-evidence/T2424-0024.time
          node --test tests/project2424TrustUnderUncertainty.test.mjs tests/project2424TrustUnderUncertaintyQa.test.mjs | tee repro-evidence/T2424-0024-tests.log

      - name: Reproduce T2424-0026 counterfactual defect worlds
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0026/experiment/run.mjs > repro-evidence/T2424-0026-counterfactual.json; } 2> repro-evidence/T2424-0026.time
          node --test tests/counterfactualDefectWorlds.test.mjs | tee repro-evidence/T2424-0026-tests.log

      - name: Reproduce T2424-0037 controlled NeuroCAD benchmark
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0037/benchmark/run.mjs > repro-evidence/T2424-0037-benchmark.json; } 2> repro-evidence/T2424-0037-benchmark.time
          node --test tests/nlpToCad.test.mjs tests/nlpToCadBenchmark.test.mjs | tee repro-evidence/T2424-0037-tests.log

      - name: Execute T2424-0037 OOD language and safety development benchmark
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0037/benchmark/ood_run.mjs > repro-evidence/T2424-0037-ood.json; } 2> repro-evidence/T2424-0037-ood.time

      - name: Reproduce T2424-0050 bounded Darcy screen
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0050/experiment/run.mjs > repro-evidence/T2424-0050-darcy.json; } 2> repro-evidence/T2424-0050.time
          node --test tests/project2424DarcyLatentOperator.test.mjs | tee repro-evidence/T2424-0050-tests.log

      - name: Record completion and evidence manifest
        run: |
          set -euo pipefail
          echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee repro-evidence/completed.txt
          (cd repro-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > repro-evidence/SHA256SUMS.txt
          cat repro-evidence/SHA256SUMS.txt

      - name: Upload raw reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project2424-research-repro-wave
          path: repro-evidence
          if-no-files-found: error
          retention-days: 30
