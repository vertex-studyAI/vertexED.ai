name: Research Reproducibility Wave

on:
  push:
    branches:
      - agent/research-repro-wave-20260812
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup repository-conformant Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'

      - name: Capture environment
        run: |
          set -euo pipefail
          mkdir -p repro-evidence
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -srmo)"
            echo "cpu_count=$(getconf _NPROCESSORS_ONLN)"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee repro-evidence/environment.txt

      - name: Reproduce T2424-0025 robust-readout screen
        run: |
          set -euo pipefail
          { time -p node portfolio/project2424/projects/T2424-0025/experiment/run.mjs > repro-evidence/T2424-0025-screen.json; } 2> repro-evidence/T2424-0025-screen.time
          { time -p node portfolio/project2424/projects/T2424-0025/experiment/ablation.mjs > repro-evidence/T2424-0025-ablation.json; } 2> repro-evidence/T2424-0025-ablation.time
          node - <<'NODE' | tee repro-evidence/T2424-0025-verification.json
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('repro-evidence/T2424-0025-screen.json'));
          const a = JSON.parse(fs.readFileSync('repro-evidence/T2424-0025-ablation.json'));
          if (s.verdict !== 'PASS_HEAVY_TAIL_MEMORY_SCREEN') process.exit(1);
          if (a.sweep?.seeds !== 50) process.exit(1);
          const zero = a.sweep.rows.find((r) => r.contaminationRate === 0);
          if (!zero || !(zero.metrics.median.mean < zero.metrics.mean.mean)) process.exit(1);
          console.log(JSON.stringify({
            screen_verdict: s.verdict,
            ablation_seeds: a.sweep.seeds,
            zero_contamination_negative_control: 'ROBUST_READOUT_STILL_BETTER',
            verifier_schema: 'canonical sweep schema'
          }, null, 2));
          NODE
          node --test tests/project2424NonGaussianMemory.test.mjs tests/project2424NonGaussianMemoryAblation.test.mjs | tee repro-evidence/T2424-0025-tests.log

      - name: Reproduce T2424-0027 latent-language synthetic audit
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0027/experiment/run.mjs repro-evidence/T2424-0027-results.json
          node portfolio/project2424/projects/T2424-0027/reproduction/verify.mjs | tee repro-evidence/T2424-0027-verify.log
          node --test tests/project2424LatentLanguageAudit.test.mjs | tee repro-evidence/T2424-0027-tests.log

      - name: Reproduce T2424-0028 residual-event tokenization
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0028/experiment/run.mjs | tee repro-evidence/T2424-0028-residual-events.json
          node --test tests/residualEventTokenization.test.mjs | tee repro-evidence/T2424-0028-tests.log

      - name: Reproduce T2424-0029 PDE representation transitions
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0029/experiment/run.mjs | tee repro-evidence/T2424-0029-pde-transitions.json
          node --test tests/pdeRepresentationTransitions.test.mjs | tee repro-evidence/T2424-0029-tests.log

      - name: Reproduce T2424-0024 trust-under-uncertainty evaluator
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0024/experiment/run.mjs | tee repro-evidence/T2424-0024-trust.json
          node --test tests/project2424TrustUnderUncertainty.test.mjs tests/project2424TrustUnderUncertaintyQa.test.mjs | tee repro-evidence/T2424-0024-tests.log

      - name: Reproduce T2424-0026 counterfactual defect worlds
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0026/experiment/run.mjs | tee repro-evidence/T2424-0026-counterfactual.json
          node --test tests/counterfactualDefectWorlds.test.mjs | tee repro-evidence/T2424-0026-tests.log

      - name: Reproduce T2424-0037 controlled NeuroCAD benchmark
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0037/benchmark/run.mjs | tee repro-evidence/T2424-0037-benchmark.json
          node --test tests/nlpToCad.test.mjs tests/nlpToCadBenchmark.test.mjs | tee repro-evidence/T2424-0037-tests.log

      - name: Execute T2424-0037 OOD language and safety development benchmark
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0037/benchmark/ood_run.mjs | tee repro-evidence/T2424-0037-ood.json
          node - <<'NODE' | tee repro-evidence/T2424-0037-ood-verification.json
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('repro-evidence/T2424-0037-ood.json'));
          if (r.totalCases !== 30) process.exit(1);
          if (r.frozenScope !== 'single rectangular-plate family only; language/safety robustness expansion') process.exit(1);
          if (!Number.isFinite(r.typedIr.decisionAccuracy)) process.exit(1);
          if (!Array.isArray(r.records) || r.records.length !== 30) process.exit(1);
          console.log(JSON.stringify({
            evidenceClass: r.evidenceClass,
            typedDecisionAccuracy: r.typedIr.decisionAccuracy,
            typedConstraintAccuracy: r.typedIr.exactConstraintAccuracyOnExpectedAccept,
            typedUnsafeAcceptanceRate: r.typedIr.unsafeAcceptanceRateOnExpectedReject,
            directDecisionAccuracy: r.naiveDirectBaseline.decisionAccuracy,
            directUnsafeAcceptanceRate: r.naiveDirectBaseline.unsafeAcceptanceRateOnExpectedReject,
            no_general_nlp_to_cad_claim: true
          }, null, 2));
          NODE

      - name: Reproduce T2424-0050 bounded Darcy screen
        run: |
          set -euo pipefail
          node portfolio/project2424/projects/T2424-0050/experiment/run.mjs | tee repro-evidence/T2424-0050-darcy.json
          node --test tests/project2424DarcyLatentOperator.test.mjs | tee repro-evidence/T2424-0050-tests.log

      - name: Record completion
        run: |
          set -euo pipefail
          echo "completed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee repro-evidence/completed.txt

      - name: Upload raw reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project2424-research-repro-wave
          path: repro-evidence
          if-no-files-found: error
          retention-days: 30
