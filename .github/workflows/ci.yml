name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-current-main:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Merge current main and restore canonical shared files
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff origin/main || true

          # These files are owned by the concurrent security/reliability merges on main.
          git checkout origin/main -- package.json package-lock.json .github/workflows/ci.yml
          git add package.json package-lock.json .github/workflows/ci.yml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts remain:"
            echo "$unresolved"
            exit 1
          fi

          git commit -m "Merge current main into activation analytics branch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate portfolio shell scripts
        run: |
          set -euo pipefail
          find portfolio/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release gate
        run: npm run ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'

  browser-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser certification
        env:
          PLAYWRIGHT_BASE_URL: https://www.vertexed.app
          PLAYWRIGHT_API_URL: https://www.vertexed.app
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Wait for production deployment and run smoke tests
        env:
          SMOKE_BASE_URL: https://www.vertexed.app
        run: |
          set -euo pipefail
          max_attempts=8
          retry_delay_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[smoke] Attempt ${attempt}/${max_attempts}"
            if npm run test:smoke; then
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "[smoke] Deployment may still be propagating; retrying in ${retry_delay_seconds}s"
              sleep "$retry_delay_seconds"
            fi
          done

          echo "[smoke] Production smoke tests failed after ${max_attempts} attempts"
          exit 1
