name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate portfolio shell scripts
        run: |
          set -euo pipefail
          find portfolio/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Test Project 2424 recovery package
        run: bash portfolio/tests/test_project2424_restore_package.sh

      - name: Test Bu1LD deployment repair fail-closed behavior
        run: bash portfolio/tests/test_bu1ld_deployment_repair.sh

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release gate
        run: npm run ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'

  browser-local-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build current branch
        run: npm run build:ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'

      - name: Run local keyboard accessibility certification
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_API_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vertexed-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/vertexed-preview.log
              exit 1
            fi
            sleep 1
          done

          npm run test:e2e:local-accessibility

      - name: Upload local accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-local-accessibility-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  browser-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser certification
        env:
          PLAYWRIGHT_BASE_URL: https://www.vertexed.app
          PLAYWRIGHT_API_URL: https://www.vertexed.app
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-production-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Wait for production deployment and run smoke tests
        env:
          SMOKE_BASE_URL: https://www.vertexed.app
        run: |
          set -euo pipefail
          export EXPECTED_VERTEXED_REVISION="$(node scripts/vercel-ignore-build.mjs --print-latest-runtime-revision)"
          echo "[smoke] Expected deploy-relevant revision: ${EXPECTED_VERTEXED_REVISION}"
          max_attempts=8
          retry_delay_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[smoke] Attempt ${attempt}/${max_attempts}"
            if npm run test:smoke; then
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "[smoke] Deployment may still be propagating; retrying in ${retry_delay_seconds}s"
              sleep "$retry_delay_seconds"
            fi
          done

          echo "[smoke] Production smoke tests failed after ${max_attempts} attempts"
          exit 1
