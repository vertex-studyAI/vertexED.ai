name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release gate
        run: npm run ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'

  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for production deployment and run smoke tests
        env:
          SMOKE_BASE_URL: https://www.vertexed.app
        run: |
          set -euo pipefail
          max_attempts=8
          retry_delay_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[smoke] Attempt ${attempt}/${max_attempts}"
            if npm run test:smoke; then
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "[smoke] Deployment may still be propagating; retrying in ${retry_delay_seconds}s"
              sleep "$retry_delay_seconds"
            fi
          done

          echo "[smoke] Production smoke tests failed after ${max_attempts} attempts"
          exit 1
