name: T2424-0025 bounded paper PDF

on:
  pull_request:
    paths:
      - "portfolio/project2424/projects/T2424-0025/**"
      - "scripts/render-t2424-0025-paper-pdf.mjs"
      - "tests/t2424-0025-paper-pdf.test.mjs"
      - "tests/t2424-0025-current-main-reconciliation.test.mjs"
      - ".github/workflows/t2424-0025-paper-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2424-0025-paper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate retained-data figures only
        run: node portfolio/project2424/projects/T2424-0025/figures/generate.mjs
      - name: Reject figure or derived-data drift
        run: git diff --exit-code -- portfolio/project2424/projects/T2424-0025/figures
      - name: Run claim/evidence and renderer guards
        run: node --test tests/t2424-0025-current-main-reconciliation.test.mjs tests/t2424-0025-paper-pdf.test.mjs
      - name: Render exact-head PDF twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/t2424-0025-paper
          node scripts/render-t2424-0025-paper-pdf.mjs \
            portfolio/project2424/projects/T2424-0025/MANUSCRIPT.md \
            portfolio/project2424/projects/T2424-0025/figures/figure1_contamination_mae.svg \
            portfolio/project2424/projects/T2424-0025/figures/figure2_relative_improvement.svg \
            dist/t2424-0025-paper/T2424-0025-robust-weighted-readouts.pdf
          node scripts/render-t2424-0025-paper-pdf.mjs \
            portfolio/project2424/projects/T2424-0025/MANUSCRIPT.md \
            portfolio/project2424/projects/T2424-0025/figures/figure1_contamination_mae.svg \
            portfolio/project2424/projects/T2424-0025/figures/figure2_relative_improvement.svg \
            dist/t2424-0025-paper/rebuilt.pdf
          cmp dist/t2424-0025-paper/T2424-0025-robust-weighted-readouts.pdf dist/t2424-0025-paper/rebuilt.pdf
          rm dist/t2424-0025-paper/rebuilt.pdf
      - name: Retain source-bound paper receipt
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/t2424-0025-paper/T2424-0025-robust-weighted-readouts.pdf | tee dist/t2424-0025-paper/SHA256SUMS
          node - <<'NODE'
          const fs = require('fs');
          const reconciliation = require('./portfolio/project2424/projects/T2424-0025/CURRENT_MAIN_RECONCILIATION.json');
          const receipt = {
            source_head: process.env.EXPECTED_SOURCE_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            frozen_experiment_source: reconciliation.frozen_experiment_source,
            scientific_execution_performed: false,
            outcome_reexecution_performed: false,
            release_authorized: false,
            scientific_status: 'BOUNDED_SYNTHETIC_EFFECT_WITH_NEGATIVE_MECHANISM_CONTROL',
            final_visual_review_completed: false
          };
          fs.writeFileSync('dist/t2424-0025-paper/build.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
      - name: Upload source-bound manuscript artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t2424-0025-current-main-paper-${{ env.EXPECTED_SOURCE_SHA }}
          path: dist/t2424-0025-paper
          if-no-files-found: error
          retention-days: 30
