name: Refresh dependency lock

on:
  push:
    branches:
      - agent/production-health-monitor
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-lock-agent-production-health-monitor
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/production-health-monitor

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile from patched overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production audit has no high findings
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched dependencies"
          git push origin HEAD:agent/production-health-monitor
