name: Bu1LD Public Route Legacy Smoke

# VertexED is not the canonical Bu1LD release owner. Keep this bounded,
# read-only compatibility smoke available for explicit/manual or source-change
# verification, but do not schedule it as an autonomous release monitor.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bu1ld-production-health.yml'
      - 'portfolio/scripts/bu1ld-production-smoke.mjs'
      - 'portfolio/BU1LD_PRODUCTION_MONITORING.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bu1ld-production-health.yml'
      - 'portfolio/scripts/bu1ld-production-smoke.mjs'
      - 'portfolio/BU1LD_PRODUCTION_MONITORING.md'

permissions:
  contents: read

concurrency:
  group: bu1ld-production-health-${{ github.event_name }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  public-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Validate smoke contract syntax
        run: node --check portfolio/scripts/bu1ld-production-smoke.mjs

      - name: Check public route availability
        env:
          BU1LD_BASE_URL: https://thebu1ld.com
          BU1LD_SMOKE_TIMEOUT_MS: '12000'
        run: |
          set -o pipefail
          node portfolio/scripts/bu1ld-production-smoke.mjs 2>&1 | tee bu1ld-production-smoke.log

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Bu1LD public route legacy smoke'
            echo
            echo '- Target: https://thebu1ld.com'
            echo '- Ownership: VertexED is not the canonical Bu1LD release owner; this workflow is not a release monitor'
            echo '- Contract: landing, signup, login, projects, programs, evidence, privacy, and terms return meaningful HTML'
            echo '- Safety: read-only GET requests; no authentication, account creation, or data writes'
            echo '- Boundary: does not execute client JavaScript, certify authenticated behavior, or certify deployment identity'
            echo '- Evidence: bu1ld-production-smoke-${{ github.run_id }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bu1ld-production-smoke-${{ github.run_id }}
          path: bu1ld-production-smoke.log
          if-no-files-found: error
          retention-days: 14
