name: Repair fflate lock

on:
  push:
    branches:
      - fix/deps-fflate-083-20260906

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update fflate lock resolution with npm
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm update fflate --package-lock-only --ignore-scripts

      - name: Assert npm changed only fflate resolution
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const key = 'node_modules/fflate';
          const beforeEntry = before?.packages?.[key];
          const afterEntry = after?.packages?.[key];
          if (!beforeEntry || beforeEntry.version !== '0.8.2') {
            throw new Error(`Expected prior fflate 0.8.2, found ${beforeEntry?.version ?? 'missing'}`);
          }
          if (!afterEntry || afterEntry.version !== '0.8.3') {
            throw new Error(`Expected repaired fflate 0.8.3, found ${afterEntry?.version ?? 'missing'}`);
          }
          delete before.packages[key];
          delete after.packages[key];
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            throw new Error('npm changed package-lock content outside node_modules/fflate');
          }
          NODE
          test "$(git diff --name-only)" = "package-lock.json"
          git diff --check

      - name: Verify lock installs exactly
        run: npm ci --ignore-scripts

      - name: Verify production audit clears moderate findings
        run: npm audit --omit=dev --audit-level=moderate

      - name: Show scoped lock diff
        run: git diff -- package-lock.json

      - name: Commit repaired lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): update fflate lock to 0.8.3"
          git push origin HEAD:${GITHUB_REF_NAME}
