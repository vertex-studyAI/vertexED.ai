name: Refresh Security Lockfile

on:
  push:
    branches:
      - percy/scheduled-production-monitor
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

concurrency:
  group: refresh-security-lockfile
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi

          git commit -m "security: refresh lockfile for patched overrides"
          git push origin "HEAD:${GITHUB_REF_NAME}"
