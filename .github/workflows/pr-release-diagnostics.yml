name: PR Release Diagnostics

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-release-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  diagnose-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Lint CI surface
        run: npm run lint:ci
      - name: Typecheck application
        run: npm run typecheck
      - name: Validate Vercel functions
        run: node scripts/validate-vercel-functions.mjs
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Run source tests
        run: npm test
      - name: Run frozen evaluation tests
        run: npm run test:eval
      - name: Build exact candidate
        run: npm run build:ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'
      - name: Check bundle performance
        run: npm run performance:bundle
