name: T2424-0027 v3 Preregistration Lock

on:
  push:
    branches:
      - experiment/t2424-0027-v3-prereg-20260830
    paths:
      - "portfolio/project2424/projects/T2424-0027/real_encoder/manifest.json"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/manifest_v3_preregistered.json"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/run.py"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/validate_v3_prereg.py"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/validate_v3_runner_lock.py"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/verify_v3_dataset_gate.py"
      - ".github/workflows/t2424-0027-v3-prereg.yml"
  pull_request:
    paths:
      - "portfolio/project2424/projects/T2424-0027/real_encoder/manifest_v3_preregistered.json"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/run.py"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/validate_v3_prereg.py"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/validate_v3_runner_lock.py"
      - "portfolio/project2424/projects/T2424-0027/real_encoder/verify_v3_dataset_gate.py"
      - ".github/workflows/t2424-0027-v3-prereg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prereg-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify v3 is outcome-inaccessible and frozen against v2
        working-directory: portfolio/project2424/projects/T2424-0027/real_encoder
        run: python validate_v3_prereg.py
      - name: Verify v3 runner is locked before encoder construction
        working-directory: portfolio/project2424/projects/T2424-0027/real_encoder
        run: python validate_v3_runner_lock.py
      - name: Verify prereg files contain no model execution
        run: |
          ! grep -Eiq "SentenceTransformer\(|model\.encode\(|model\.fit\(|model\.predict\(" portfolio/project2424/projects/T2424-0027/real_encoder/manifest_v3_preregistered.json
          ! grep -Eiq "SentenceTransformer\(|model\.encode\(|model\.fit\(|model\.predict\(" portfolio/project2424/projects/T2424-0027/real_encoder/validate_v3_prereg.py
          ! grep -Eiq "SentenceTransformer\(|model\.encode\(|model\.fit\(|model\.predict\(" portfolio/project2424/projects/T2424-0027/real_encoder/verify_v3_dataset_gate.py
          ! grep -Eiq "SentenceTransformer\(|model\.encode\(|model\.fit\(|model\.predict\(" portfolio/project2424/projects/T2424-0027/real_encoder/validate_v3_runner_lock.py
      - name: Install dataset-only dependency
        run: python -m pip install --disable-pip-version-check datasets==2.21.0 huggingface-hub==0.24.7
      - name: Recompute frozen v3 feasibility set before encoder access
        working-directory: portfolio/project2424/projects/T2424-0027/real_encoder
        run: python verify_v3_dataset_gate.py
      - name: Verify retained gate evidence remains outcome-free
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("portfolio/project2424/projects/T2424-0027/real_encoder/v3_dataset_gate_evidence.json")
          d = json.loads(p.read_text())
          assert d["verdict"] == "PASS_DATASET_ONLY_V3_FEASIBILITY_GATE"
          assert d["admissible_intent_count"] == 50
          assert d["minimum_frozen_cell_count"] >= 15
          assert d["execution_authorized"] is False
          assert d["encoder_instantiated"] is False
          assert d["model_outcomes_accessed"] is False
          PY
      - name: Upload dataset-only feasibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: t2424-0027-v3-dataset-gate-${{ github.sha }}
          path: portfolio/project2424/projects/T2424-0027/real_encoder/v3_dataset_gate_evidence.json
          if-no-files-found: error
          retention-days: 90
