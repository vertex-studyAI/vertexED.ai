name: T2424-1863 paper PDF

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portfolio/new-projects/t2424-1863-local-diffusion-operator/paper/**"
      - "portfolio/new-projects/t2424-1863-local-diffusion-operator/scripts/render-paper-pdf.mjs"
      - ".github/workflows/t2424-1863-paper-pdf.yml"

permissions:
  contents: read

jobs:
  render-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render exact-head PDF
        run: |
          node portfolio/new-projects/t2424-1863-local-diffusion-operator/scripts/render-paper-pdf.mjs \
            portfolio/new-projects/t2424-1863-local-diffusion-operator/paper/MANUSCRIPT.md \
            portfolio/new-projects/t2424-1863-local-diffusion-operator/paper/evidence/per_seed_relative_improvement.svg \
            dist/t2424-1863-paper/T2424-1863-negative-result.pdf
      - name: Verify deterministic PDF bytes
        run: |
          node portfolio/new-projects/t2424-1863-local-diffusion-operator/scripts/render-paper-pdf.mjs \
            portfolio/new-projects/t2424-1863-local-diffusion-operator/paper/MANUSCRIPT.md \
            portfolio/new-projects/t2424-1863-local-diffusion-operator/paper/evidence/per_seed_relative_improvement.svg \
            dist/t2424-1863-paper/rebuilt.pdf
          cmp dist/t2424-1863-paper/T2424-1863-negative-result.pdf dist/t2424-1863-paper/rebuilt.pdf
          rm dist/t2424-1863-paper/rebuilt.pdf
      - name: Retain build provenance
        run: |
          sha256sum dist/t2424-1863-paper/T2424-1863-negative-result.pdf | tee dist/t2424-1863-paper/SHA256SUMS
          node -e 'const fs=require("fs"); fs.writeFileSync("dist/t2424-1863-paper/build.json", JSON.stringify({head:process.env.GITHUB_SHA, run:process.env.GITHUB_RUN_ID, protocol_change:false, scientific_verdict:"NEGATIVE_OR_INCONCLUSIVE_AGAINST_PREDECLARED_GATE"}, null, 2)+"\n")'
      - name: Upload rendered manuscript
        uses: actions/upload-artifact@v4
        with:
          name: t2424-1863-rendered-paper
          path: dist/t2424-1863-paper
          if-no-files-found: error
          retention-days: 30
