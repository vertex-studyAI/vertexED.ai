name: Security Lockfile Refresh

on:
  pull_request:
    branches: [main, master]
    paths:
      - package.json
      - package-lock.json
      - '.github/workflows/security-lockfile-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-lockfile-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Generate patched lockfile
        shell: bash
        run: |
          set -uo pipefail
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high > security-audit.log 2>&1 || true

      - name: Summarize generated audit
        if: always()
        shell: bash
        run: |
          {
            echo '## Generated dependency remediation'
            echo
            echo 'A patched lockfile and the production audit output are retained as an artifact for review before committing.'
            echo
            echo '```text'
            cat security-audit.log 2>/dev/null || echo 'Audit log was not generated.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-lockfile-refresh-${{ github.run_id }}
          path: |
            package-lock.json
            security-audit.log
          if-no-files-found: error
          retention-days: 7
