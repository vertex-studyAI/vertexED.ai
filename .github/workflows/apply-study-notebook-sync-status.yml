name: Study Notebook sync status

on:
  pull_request:
    branches: [main, master]
    paths:
      - src/pages/StudyNotebook.tsx
      - src/lib/notebookSync.ts
      - tests/study-notebook-sync-status.test.mjs
      - .github/workflows/apply-study-notebook-sync-status.yml
  push:
    branches: [main, master]
    paths:
      - src/pages/StudyNotebook.tsx
      - src/lib/notebookSync.ts
      - tests/study-notebook-sync-status.test.mjs
      - .github/workflows/apply-study-notebook-sync-status.yml

permissions:
  contents: read

concurrency:
  group: study-notebook-sync-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Study Notebook sync-status regression
        run: node --test tests/study-notebook-sync-status.test.mjs
