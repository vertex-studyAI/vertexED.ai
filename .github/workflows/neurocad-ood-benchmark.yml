name: NeuroCAD held-out template benchmark

on:
  pull_request:
    paths:
      - 'portfolio/project2424/projects/T2424-0037/**'
      - 'tests/nlpToCadOodBenchmark.test.mjs'
      - '.github/workflows/neurocad-ood-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio/project2424/projects/T2424-0037/**'
      - 'tests/nlpToCadOodBenchmark.test.mjs'
      - '.github/workflows/neurocad-ood-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture environment
        run: |
          mkdir -p artifacts/neurocad-ood
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -a)"
            echo "sha=${GITHUB_SHA}"
          } | tee artifacts/neurocad-ood/environment.txt
      - name: Execute frozen held-out benchmark
        run: |
          node portfolio/project2424/projects/T2424-0037/benchmark/ood_evaluate.mjs \
            | tee artifacts/neurocad-ood/results.json
      - name: Verify benchmark contract
        run: node --test tests/nlpToCadOodBenchmark.test.mjs | tee artifacts/neurocad-ood/tests.log
      - name: Install OpenSCAD for backend execution verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version | tee artifacts/neurocad-ood/openscad-version.txt
      - name: Execute generated CAD through OpenSCAD
        run: |
          node portfolio/project2424/projects/T2424-0037/benchmark/kernel_verify.mjs \
            artifacts/neurocad-ood/kernel \
            | tee artifacts/neurocad-ood/kernel-results.json
      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: neurocad-held-out-template-v1
          path: artifacts/neurocad-ood/
          retention-days: 30
