name: T2424-0025 current-main reconciliation

on:
  pull_request:
    paths:
      - "portfolio/project2424/projects/T2424-0025/**"
      - "tests/t2424-0025-current-main-reconciliation.test.mjs"
      - ".github/workflows/t2424-0025-current-main-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2424-0025-reconcile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Verify retained claim-to-evidence boundary
        run: node --test tests/t2424-0025-current-main-reconciliation.test.mjs
      - name: Confirm scientific runners were not invoked
        shell: bash
        run: |
          set -euo pipefail
          test -f portfolio/project2424/projects/T2424-0025/CURRENT_MAIN_RECONCILIATION.json
          node -e 'const r=require("./portfolio/project2424/projects/T2424-0025/CURRENT_MAIN_RECONCILIATION.json"); if (r.scientific_execution_performed !== false || r.outcome_reexecution_performed !== false || r.release_authorized !== false) process.exit(1)'
