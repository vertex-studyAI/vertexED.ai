name: Independent LAM-JEPA PR16 QA

on:
  pull_request:
    paths:
      - ".github/workflows/independent-lam-jepa-pr16-qa.yml"
      - "portfolio/qa/verify_lam_jepa_pr16.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_COMMIT: 4c7ee1280587da3e73b7ffd596190be657733aab
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout independent verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout immutable LAM-JEPA target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vertex-studyAI/LAM-JEPA
          ref: ${{ env.TARGET_COMMIT }}
          path: target
          persist-credentials: false

      - name: Assert exact clean target
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          test -z "$(git -C target status --porcelain)"
          printf '%s\n' "$(git -C target rev-parse HEAD)" > target-commit.txt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install target from clean checkout
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './target[pretrained-baselines]'
          python -m py_compile portfolio/qa/verify_lam_jepa_pr16.py

      - name: Download checksum-addressed ARC development splits
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          python target/scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir qa-evidence/arc-data \
            | tee qa-evidence/arc-download.json
          test ! -e qa-evidence/arc-data/arc-challenge-test.parquet

      - name: Independently reproduce parameter-matched smoke
        run: |
          set -euo pipefail
          python target/scripts/benchmark/run_arc_matched_baseline.py \
            --train qa-evidence/arc-data/arc-challenge-train.parquet \
            --validation qa-evidence/arc-data/arc-challenge-validation.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 4 \
            --model-steps 1 \
            --train-limit 32 \
            --validation-limit 32 \
            --device cpu \
            --match-tolerance 0.05 \
            --out qa-evidence/independent-matched.json \
            | tee qa-evidence/independent-matched-output.txt

      - name: Independently reproduce pretrained smoke
        run: |
          set -euo pipefail
          python target/scripts/benchmark/run_arc_pretrained_baseline.py \
            --train qa-evidence/arc-data/arc-challenge-train.parquet \
            --validation qa-evidence/arc-data/arc-challenge-validation.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --max-length 96 \
            --max-train-steps 1 \
            --model-steps 1 \
            --train-limit 8 \
            --validation-limit 16 \
            --device cpu \
            --out qa-evidence/independent-pretrained.json \
            | tee qa-evidence/independent-pretrained-output.txt

      - name: Verify without target-repository verifier code
        run: |
          set -euo pipefail
          python portfolio/qa/verify_lam_jepa_pr16.py \
            --matched qa-evidence/independent-matched.json \
            --pretrained qa-evidence/independent-pretrained.json \
            --target-commit-file target-commit.txt \
            --out qa-evidence/independent-verdict.json \
            | tee qa-evidence/independent-verifier-output.txt

      - name: Upload independent QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-lam-jepa-pr16-qa
          path: |
            target-commit.txt
            qa-evidence/*.json
            qa-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
