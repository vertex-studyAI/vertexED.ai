name: FinanceMeta landing validation

on:
  push:
    branches:
      - percy/finance-meta-landing-recovery-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finance-meta-landing-recovery-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout immutable execution commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout immutable FinanceMeta target
        uses: actions/checkout@v5
        with:
          repository: build-the-future-11/FinanceMeta-Landing
          ref: f9265ce6ae94bf01048271ecfcf09d5be7059604
          path: target

      - name: Apply plain reviewable recovery source
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$GITHUB_WORKSPACE/portfolio/patches/finance-meta-landing"
          target_dir="$GITHUB_WORKSPACE/target"

          rm -rf "$target_dir/src" "$target_dir/tests" "$target_dir/e2e" "$target_dir/.github"
          rm -f \
            "$target_dir/index.html" \
            "$target_dir/index.css" \
            "$target_dir/package.json" \
            "$target_dir/tsconfig.json" \
            "$target_dir/playwright.config.ts" \
            "$target_dir/tailwind_config.js" \
            "$target_dir/tailwind.config.js" \
            "$target_dir/postcss.config.js"

          cp -R "$bundle_dir/overlay/." "$target_dir/"

          test -f "$target_dir/src/main.tsx"
          test -f "$target_dir/src/index.css"
          test -f "$target_dir/tests/source.test.mjs"
          test -f "$target_dir/e2e/landing.spec.ts"
          grep -q 'createRoot(root).render' "$target_dir/src/main.tsx"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Regenerate dependency lock from the recovered manifest
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        working-directory: target
        run: npm ci

      - name: Run canonical release gate
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          npm run ci 2>&1 | tee "$GITHUB_WORKSPACE/finance-meta-ci.log"

      - name: Install Chromium
        working-directory: target
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser certification
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee "$GITHUB_WORKSPACE/finance-meta-browser.log"

      - name: Generate durable validation evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$GITHUB_WORKSPACE/portfolio/patches/finance-meta-landing"
          target_dir="$GITHUB_WORKSPACE/target"
          target_sha="$(git -C "$target_dir" rev-parse HEAD)"
          execution_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$target_sha" = "f9265ce6ae94bf01048271ecfcf09d5be7059604"
          test -f "$target_dir/dist/index.html"

          git -C "$target_dir" add -A
          git -C "$target_dir" diff --cached --binary -- . ':(exclude)package-lock.json' \
            > "$bundle_dir/finance-meta-landing-recovery.patch"
          git -C "$target_dir" diff --cached --binary -- package-lock.json \
            > "$bundle_dir/finance-meta-landing-package-lock.patch"
          test -s "$bundle_dir/finance-meta-landing-recovery.patch"
          test -s "$bundle_dir/finance-meta-landing-package-lock.patch"

          recovery_digest="$(sha256sum "$bundle_dir/finance-meta-landing-recovery.patch" | awk '{print $1}')"
          lock_digest="$(sha256sum "$bundle_dir/finance-meta-landing-package-lock.patch" | awk '{print $1}')"
          dist_size="$(du -sh "$target_dir/dist" | awk '{print $1}')"
          cat > "$bundle_dir/VALIDATION.md" <<EOF
          # FinanceMeta Landing Validation

          - Target repository: \`build-the-future-11/FinanceMeta-Landing\`
          - Target base commit: \`$target_sha\`
          - Execution commit: \`$execution_sha\`
          - Validation run: \`$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\`
          - Node: \`$(node --version)\`
          - npm: \`$(npm --version)\`
          - Recovery patch SHA-256: \`$recovery_digest\`
          - Lockfile patch SHA-256: \`$lock_digest\`
          - Production bundle size: \`$dist_size\`

          ## Passed gates

          - strict TypeScript check
          - high-severity production dependency audit
          - source release-contract tests
          - Vite production build
          - emitted CSS/JavaScript asset contract
          - desktop Chromium primary journey
          - mobile Chromium primary journey
          - persisted theme control
          - keyboard focus and horizontal overflow checks

          The target repository was not modified. These results certify the stored recovery patches against the immutable target base commit above.
          EOF

      - name: Upload browser and command evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finance-meta-landing-validation-${{ github.run_id }}
          path: |
            target/playwright-report
            target/test-results
            finance-meta-ci.log
            finance-meta-browser.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit certified recovery bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          branch="percy/finance-meta-landing-recovery-20260805"
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from $GITHUB_SHA to $remote_head; refusing to overwrite newer work." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch portfolio/patches/finance-meta-landing/recovery.patch.gz.b64
          git rm -r -f --ignore-unmatch portfolio/patches/finance-meta-landing/encoded
          git rm -r -f --ignore-unmatch portfolio/patches/finance-meta-landing/overlay
          git rm -f --ignore-unmatch .github/workflows/finance-meta-landing-validation.yml
          git add portfolio/patches/finance-meta-landing/finance-meta-landing-recovery.patch
          git add portfolio/patches/finance-meta-landing/finance-meta-landing-package-lock.patch
          git add portfolio/patches/finance-meta-landing/VALIDATION.md
          git commit -m "test: certify FinanceMeta landing recovery bundle"
          git push origin "HEAD:$branch"
