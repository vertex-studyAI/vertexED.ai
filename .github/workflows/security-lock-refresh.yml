name: Security Lock Refresh

on:
  push:
    branches:
      - security/dependency-remediation-20260808
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  generate-lock-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v5
        with:
          ref: security/dependency-remediation-20260808
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile and apply non-breaking npm audit fixes
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Upload npm-generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: vertexed-security-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated dependency graph
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  commit-lock-on-branch-push:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    needs: generate-lock-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: security/dependency-remediation-20260808
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regenerate security-fixed lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Commit npm-generated lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'Regenerate lockfile for security remediation'
          git push origin HEAD:security/dependency-remediation-20260808
