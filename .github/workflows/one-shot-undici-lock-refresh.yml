name: One-shot Undici audit classification

on:
  push:
    branches:
      - eng/undici-7-29-1-lock-refresh-20260915

permissions:
  contents: read

jobs:
  classify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Verify lock and classify full audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages?.['node_modules/undici']?.version;
          console.log(`locked undici=${version}`);
          if (version !== '7.29.1') throw new Error(`expected undici 7.29.1, got ${version}`);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_status=$?
          set -e
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('audit vulnerability counts:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          const vulns = audit.vulnerabilities ?? {};
          if (vulns.undici) throw new Error('undici remains present in npm audit vulnerabilities');
          for (const [name, item] of Object.entries(vulns)) {
            const via = (item.via ?? []).map((v) => typeof v === 'string' ? v : `${v.source ?? 'n/a'}:${v.title ?? 'untitled'}:${v.url ?? 'no-url'}`);
            console.log(JSON.stringify({name, severity: item.severity, isDirect: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via}));
          }
          NODE
          echo "npm audit exit status: ${audit_status}"
