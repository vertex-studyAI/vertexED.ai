name: Dependency lock refresh wave12

on:
  push:
    branches:
      - ci/harden-bu1ld-component-actions-20260902-wave12
    paths:
      - 'package.json'
      - '.github/workflows/dependency-lock-refresh-wave12.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ci/harden-bu1ld-component-actions-20260902-wave12
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production audit on regenerated lock
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile to this isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: refresh lockfile for patched transitives'
          git push origin HEAD:ci/harden-bu1ld-component-actions-20260902-wave12
