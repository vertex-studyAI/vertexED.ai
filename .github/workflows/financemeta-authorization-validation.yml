name: FinanceMeta Authorization Recovery Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/financemeta-authorization-validation.yml'
      - 'portfolio/financemeta/authorization-hardening/**'

permissions:
  contents: read

concurrency:
  group: financemeta-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_COMMIT: fbdd503223edc5b1780509720391083f485a4a85

    steps:
      - name: Checkout portfolio control repository
        uses: actions/checkout@v5

      - name: Checkout immutable FinanceMeta source
        uses: actions/checkout@v5
        with:
          repository: build-the-future-11/finance4all-global-reach
          ref: ${{ env.TARGET_COMMIT }}
          path: target

      - name: Apply deterministic authorization recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          node portfolio/financemeta/authorization-hardening/apply-authorization-hardening.mjs target
          git -C target diff --check

      - name: Verify SQL authorization contract
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/004_authorization_hardening.sql'
          test -f supabase/migrations/002_google_oauth.sql
          test -f supabase/migrations/003_bookmarks_notifications.sql
          grep -F 'REVOKE INSERT, UPDATE ON TABLE public.profiles FROM anon, authenticated' "$migration"
          grep -F 'WITH CHECK (auth.uid() = id)' "$migration"
          grep -F "WITH CHECK (auth.uid() = id AND role = 'member'::public.user_role)" "$migration"
          grep -F 'GRANT UPDATE (display_name, avatar_url, bio, interests, open_to_collaborate, chapter_id)' "$migration"
          ! grep -E 'GRANT (INSERT|UPDATE) \([^)]*role' "$migration"
          grep -F 'ALTER FUNCTION public.handle_new_user() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.get_user_role() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.is_admin() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.is_lead_or_admin() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.notify_connection_request() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.notify_connection_accepted() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.notify_lab_application_received() SET search_path = public' "$migration"
          grep -F 'ALTER FUNCTION public.notify_lab_application_status() SET search_path = public' "$migration"
          grep -F 'DROP POLICY IF EXISTS "System insert notifications" ON public.notifications' "$migration"
          grep -F 'REVOKE INSERT ON TABLE public.notifications FROM anon, authenticated' "$migration"
          grep -F 'ALTER VIEW public.essay_submissions_with_counts SET (security_invoker = true)' "$migration"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install frozen dependencies
        working-directory: target
        run: npm ci

      - name: Run target tests including authorization regression
        working-directory: target
        run: npm test

      - name: Run TypeScript check
        working-directory: target
        run: npx tsc --noEmit

      - name: Lint authorization regression itself
        working-directory: target
        run: npx eslint src/test/authorization-contract.test.ts

      - name: Record full target lint debt without hiding patch quality
        working-directory: target
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee "$GITHUB_WORKSPACE/financemeta-full-lint.txt"
          status=${PIPESTATUS[0]}
          echo "$status" > "$GITHUB_WORKSPACE/financemeta-full-lint.exit-code"
          exit 0

      - name: Record production dependency audit
        working-directory: target
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/financemeta-production-audit.json"
          status=$?
          echo "$status" > "$GITHUB_WORKSPACE/financemeta-production-audit.exit-code"
          exit 0

      - name: Run production build
        working-directory: target
        env:
          VITE_SUPABASE_URL: https://financemeta-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: npm run build

      - name: Generate reviewable target patch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git add -N supabase/migrations/004_authorization_hardening.sql src/test/authorization-contract.test.ts
          git diff --binary > "$GITHUB_WORKSPACE/financemeta-authorization-hardening.patch"
          test -s "$GITHUB_WORKSPACE/financemeta-authorization-hardening.patch"
          git apply --check "$GITHUB_WORKSPACE/financemeta-authorization-hardening.patch" --reverse
          sha256sum "$GITHUB_WORKSPACE/financemeta-authorization-hardening.patch" > "$GITHUB_WORKSPACE/financemeta-authorization-hardening.patch.sha256"
          {
            echo "target_commit=$TARGET_COMMIT"
            echo "patch_sha256=$(cut -d' ' -f1 "$GITHUB_WORKSPACE/financemeta-authorization-hardening.patch.sha256")"
            echo "full_lint_exit_code=$(cat "$GITHUB_WORKSPACE/financemeta-full-lint.exit-code")"
            echo "production_audit_exit_code=$(cat "$GITHUB_WORKSPACE/financemeta-production-audit.exit-code")"
            echo "classification=authorization_and_notification_integrity_patch_certified_pending_target_application_and_live_denial_tests"
          } > "$GITHUB_WORKSPACE/financemeta-authorization-certification.txt"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: financemeta-authorization-${{ github.run_id }}
          path: |
            financemeta-authorization-hardening.patch
            financemeta-authorization-hardening.patch.sha256
            financemeta-authorization-certification.txt
            financemeta-full-lint.txt
            financemeta-full-lint.exit-code
            financemeta-production-audit.json
            financemeta-production-audit.exit-code
          if-no-files-found: warn
          retention-days: 14
