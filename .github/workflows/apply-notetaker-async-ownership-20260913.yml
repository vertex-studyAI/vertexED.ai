name: Apply Notetaker async ownership patch

on:
  push:
    branches:
      - eng/notetaker-async-ownership-20260913
    paths:
      - scripts/patch-notetaker-async-ownership-20260913.py
      - .github/workflows/apply-notetaker-async-ownership-20260913.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact-string bounded patch
        run: python scripts/patch-notetaker-async-ownership-20260913.py

      - name: Verify intended files only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | awk '{print $2}' | sort | tr '\n' ' ')" = "src/pages/NotetakerQuiz.tsx tests/notetaker-quiz-request-invalidation.test.mjs "

      - name: Commit patch to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NotetakerQuiz.tsx tests/notetaker-quiz-request-invalidation.test.mjs
          git diff --cached --check
          git commit -m "fix(notetaker): invalidate stale async work"
          git push origin "HEAD:${GITHUB_REF_NAME}"
