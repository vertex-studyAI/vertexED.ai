name: NeuroCAD Alpha browser certification

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'portfolio/project2424/projects/T2424-0037/**'
      - 'scripts/publish-neurocad-alpha.mjs'
      - 'tests/neurocadProductQa.test.mjs'
      - 'tests/neurocadPublicRoute.test.mjs'
      - 'tests/neurocadCdnWorkflowGuard.test.mjs'
      - 'e2e/neurocad-alpha.spec.ts'
      - 'package.json'
      - '.github/workflows/neurocad-alpha-browser.yml'
      - '.github/workflows/neurocad-alpha-public-cdn.yml'
  push:
    branches: [main, master]
    paths:
      - 'portfolio/project2424/projects/T2424-0037/**'
      - 'scripts/publish-neurocad-alpha.mjs'
      - 'tests/neurocadProductQa.test.mjs'
      - 'tests/neurocadPublicRoute.test.mjs'
      - 'tests/neurocadCdnWorkflowGuard.test.mjs'
      - 'e2e/neurocad-alpha.spec.ts'
      - 'package.json'
      - '.github/workflows/neurocad-alpha-browser.yml'
      - '.github/workflows/neurocad-alpha-public-cdn.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: neurocad-alpha-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run 125-case NeuroCAD product QA
        run: node --test tests/neurocadProductQa.test.mjs tests/neurocadPublicRoute.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build deploy-shaped site
        run: npm run build:ci
        env:
          ROLLUP_SKIP_NODEJS_NATIVE: 'true'

      - name: Launch deploy-shaped NeuroCAD Alpha
        shell: bash
        run: |
          set -euo pipefail
          expected_artifact_revision="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const manifest = JSON.parse(await readFile('dist/neurocad/release-manifest.json', 'utf8')); process.stdout.write(manifest.artifactRevision);")"
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/neurocad-alpha-preview.log 2>&1 &
          echo $! > /tmp/neurocad-alpha-preview.pid
          for attempt in $(seq 1 30); do
            page="$(curl --silent --fail http://127.0.0.1:4173/neurocad/ || true)"
            if [ -n "$page" ]; then
              if ! printf '%s' "$page" | grep -Fq "neurocad-build-revision\" content=\"${GITHUB_SHA}\""; then
                echo "[neurocad] deploy-shaped route served, but repository revision stamp did not match ${GITHUB_SHA}"
                exit 1
              fi
              if ! printf '%s' "$page" | grep -Fq "neurocad-artifact-revision\" content=\"${expected_artifact_revision}\""; then
                echo "[neurocad] deploy-shaped route served, but artifact revision did not match ${expected_artifact_revision}"
                exit 1
              fi
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/neurocad-alpha-preview.log
              exit 1
            fi
            sleep 1
          done

      - name: Run flagship browser certification against /neurocad/
        env:
          CI: '1'
          NEUROCAD_BASE_URL: http://127.0.0.1:4173/neurocad/
        run: npx playwright test e2e/neurocad-alpha.spec.ts --project=desktop-1440

      - name: Stop preview server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/neurocad-alpha-preview.pid ]; then
            kill "$(cat /tmp/neurocad-alpha-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload NeuroCAD release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neurocad-alpha-release-evidence
          path: |
            artifacts/neurocad-alpha
            playwright-report
            test-results/neurocad-alpha
            test-results
            dist/neurocad/release-manifest.json
          if-no-files-found: ignore
          retention-days: 14

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: browser-certification
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for an exact executable public NeuroCAD artifact
        shell: bash
        run: |
          set -euo pipefail
          expected_artifact_revision="$(node --input-type=module -e "import { computeNeuroCadArtifactRevision } from './scripts/publish-neurocad-alpha.mjs'; process.stdout.write(await computeNeuroCadArtifactRevision());")"
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/neurocad/"
          primary_url="https://www.vertexed.app/neurocad/"
          matched=0

          # G12 is a browser-host certification. Artifact CDNs such as jsDelivr are
          # intentionally excluded because jsDelivr serves HTML as text/plain for
          # security; byte availability there is release provenance, not an app host.
          for attempt in $(seq 1 16); do
            echo "[neurocad-smoke] executable public artifact check ${attempt}/16"
            for url in "$primary_url" "$pages_url"; do
              echo "[neurocad-smoke] checking ${url}"
              page="$(curl --silent --fail "$url" || true)"
              if printf '%s' "$page" | grep -Fq "neurocad-artifact-revision\" content=\"${expected_artifact_revision}\""; then
                served_repository_revision="$(printf '%s' "$page" | sed -n 's/.*neurocad-build-revision" content="\([0-9a-f]\{7,40\}\)".*/\1/p' | head -n 1)"
                if [ -z "$served_repository_revision" ]; then
                  echo "[neurocad-smoke] matching artifact at ${url} lacked immutable repository provenance"
                  exit 1
                fi
                echo "[neurocad-smoke] matched executable artifact ${expected_artifact_revision} at ${url} from repository revision ${served_repository_revision}"
                echo "NEUROCAD_PRODUCTION_URL=${url}" >> "$GITHUB_ENV"
                echo "NEUROCAD_SERVED_REVISION=${served_repository_revision}" >> "$GITHUB_ENV"
                echo "NEUROCAD_ARTIFACT_REVISION=${expected_artifact_revision}" >> "$GITHUB_ENV"
                matched=1
                break 2
              fi
            done
            sleep 15
          done

          if [ "$matched" -ne 1 ]; then
            echo "[neurocad-smoke] expected artifact ${expected_artifact_revision} was not observed on an executable canonical /neurocad/ host"
            exit 1
          fi

      - name: Run production flagship browser smoke
        env:
          CI: '1'
        run: |
          test -n "${NEUROCAD_PRODUCTION_URL:-}"
          NEUROCAD_BASE_URL="$NEUROCAD_PRODUCTION_URL" npx playwright test e2e/neurocad-alpha.spec.ts --project=desktop-1440

      - name: Record G12 certification on deployment issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const body = [
            'Automated NeuroCAD G12 production certification: **PASS**',
            '',
            `- public URL: \`${process.env.NEUROCAD_PRODUCTION_URL}\``,
            `- served repository revision: \`${process.env.NEUROCAD_SERVED_REVISION}\``,
            `- artifact revision: \`${process.env.NEUROCAD_ARTIFACT_REVISION}\``,
            `- tested from main revision: \`${process.env.GITHUB_SHA}\``,
            '- flagship Playwright browser smoke: **PASS**',
            '',
            'This records deployment evidence only. It does not imply external engineering validation (G13).',
          ].join('\n');
          const response = await fetch(`https://api.github.com/repos/${repository}/issues/431/comments`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ body }),
          });
          if (!response.ok) throw new Error(`failed to record G12 issue evidence: ${response.status} ${await response.text()}`);
          NODE

      - name: Record production identity evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/neurocad-production
          cat > artifacts/neurocad-production/identity.txt <<EOF
          public_url=${NEUROCAD_PRODUCTION_URL:-UNVERIFIED}
          served_repository_revision=${NEUROCAD_SERVED_REVISION:-UNVERIFIED}
          artifact_revision=${NEUROCAD_ARTIFACT_REVISION:-UNVERIFIED}
          tested_from_main_revision=${GITHUB_SHA}
          EOF

      - name: Upload NeuroCAD production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neurocad-alpha-production-evidence
          path: |
            artifacts/neurocad-alpha
            artifacts/neurocad-production
            playwright-report
            test-results/neurocad-alpha
            test-results
          if-no-files-found: ignore
          retention-days: 14
