<rect x="220" y="172" width="405.273" height="28" fill="#bbb" stroke="#222" stroke-width="1"/>
<text x="633.273" y="192" font-size="14">5.7896089</text>
<text x="206" y="254" text-anchor="end" font-size="16">Eigen-JEPA</text>
<rect x="220" y="234" width="408.228" height="28" fill="#777" stroke="#222" stroke-width="1"/>
<text x="636.228" y="254" font-size="14">5.8318226</text>
<text x="206" y="316" text-anchor="end" font-size="16">Cholesky</text>
<rect x="220" y="296" width="411.337" height="28" fill="#bbb" stroke="#222" stroke-width="1"/>
<text x="639.337" y="316" font-size="14">5.8762487</text>
<text x="206" y="378" text-anchor="end" font-size="16">persistence</text>
<rect x="220" y="358" width="543.958" height="28" fill="#bbb" stroke="#222" stroke-width="1"/>
