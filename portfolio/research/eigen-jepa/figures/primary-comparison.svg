<text x="500" y="430" text-anchor="middle" font-size="13">4</text>
<line x1="640" y1="95" x2="640" y2="405" stroke="#ddd" stroke-width="1"/>
<text x="640" y="430" text-anchor="middle" font-size="13">6</text>
