<text x="500" y="455" text-anchor="middle" font-size="14">Primary matrix MSE ×10⁻⁹</text>
<text x="40" y="490" font-size="17" font-weight="700">B. Paired Eigen-JEPA − raw-ridge MSE difference (×10⁻⁹)</text>
<line x1="220" y1="520" x2="780" y2="520" stroke="#222" stroke-width="1.5"/>
<line x1="430.000" y1="495" x2="430.000" y2="555" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
