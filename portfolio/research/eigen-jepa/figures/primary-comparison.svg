<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<text x="40" y="42" font-size="22" font-weight="700">Eigen-JEPA frozen primary comparison</text>
<text x="40" y="70" font-size="14">Retained held-out aggregate evidence; n=111 chronological test blocks.</text>
<text x="40" y="98" font-size="17" font-weight="700">A. Covariance-matrix MSE (×10⁻⁹; lower is better)</text>
