[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-tracklet-baseline"
version = "0.1.0"
description = "Cheap constant-angular-velocity baseline for linking four-frame asteroid tracklets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
