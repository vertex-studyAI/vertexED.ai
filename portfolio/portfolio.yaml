operating_limits:
  maximum_active_products: 3
  maximum_active_flagship_research_projects: 5
  current_active_products: 1
  current_active_flagship_research_projects: 0
source_of_truth:
  current_host: vertex-studyAI/vertexED.ai/portfolio
  host_status: temporary
  reason: A dedicated portfolio-control repository is not available through the connected GitHub installation.
  migration_condition: Move this directory unchanged into a dedicated control repository when one is created and connected.
evidence_policy:
  - Repository state outranks planning documents and user-reported status.
  - Unknown values remain unknown.
  - A project without repository or operating evidence receives an audit task, not a completion claim.
  - No blocked research project is selected as an active flagship without code, data, benchmark, and reproduction evidence.

